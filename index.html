<title>Japan Trip Companion · 21 Nov – 4 Dec 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2eb;--card:#f5f2eb;--raise:#fbf9f4;--ink:#1c1b19;--ink2:#3b3833;--muted:#8a857c;--line:#ddd7cb;--line2:#ebe6dc;
  --accent:#c2412b;--accent-soft:rgba(194,65,43,.08);--green:#4e6a47;--indigo:#33456b;
  --red:var(--accent);--red-soft:var(--accent-soft);--amber:#8a6a2f;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark;--paper:#121211;--card:#121211;--raise:#1b1a18;--ink:#ece8e0;--ink2:#cfcac0;--muted:#8d887e;--line:#2d2b28;--line2:#211f1d;
  --accent:#e2674f;--accent-soft:rgba(226,103,79,.12);--green:#93b08a;--indigo:#a4b4d4;--amber:#c9a46a}
select option,select optgroup{background:var(--raise);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
button{font-family:inherit;color:inherit}
::selection{background:var(--accent-soft)}

/* header */
header{max-width:680px;margin:0 auto;padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:12px;align-items:baseline}
.brand .kan{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.06em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
#hdr{display:flex;gap:10px;align-items:center;padding-top:2px}
#sync{font-size:11px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer;letter-spacing:.04em}
#disp{width:auto;font:500 12px var(--mono);padding:2px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);cursor:pointer}

/* bottom tabs */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav#nav a{flex:1;max-width:120px;text-align:center;text-decoration:none;color:var(--muted);padding:16px 0 18px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav#nav a b{font-size:16px;font-weight:500;line-height:1.2}
nav#nav a span{font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
nav#nav a.on{color:var(--ink)}
nav#nav a.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--accent)}

main{max-width:680px;margin:0 auto;padding:8px 20px 110px}
h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:36px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
h2:first-child{margin-top:14px}
h3{font-size:15px;font-weight:700;margin:0 0 2px}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.kanji{font-weight:500;letter-spacing:.05em}

/* status: words, not pills */
.badge{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:none;padding:0;white-space:nowrap}
.b-book{color:var(--accent)}
.b-fixed{color:var(--ink2)}
.b-flex{color:var(--muted)}
.b-opt{color:var(--muted);font-weight:500}
.b-custom{color:var(--indigo)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;letter-spacing:.04em}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.btn.red{color:var(--accent);border-color:var(--accent)}
.btn.red.arm{background:var(--accent);color:var(--paper)}
.lnk{background:none;border:0;color:var(--ink2);font-weight:500;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* day strip */
.strip{display:flex;gap:2px;overflow-x:auto;padding:4px 0 2px;margin:4px -20px 0;padding-left:20px;padding-right:20px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;padding:6px 8px 8px;cursor:pointer;text-align:center;min-width:46px;color:var(--muted);border-bottom:2px solid transparent}
.chip span{display:block;font-size:11px;line-height:1.3}
.chip b{display:block;font:400 20px/1.25 var(--mono)}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.chip.today b{color:var(--accent)}

/* day header */
.dayhead{border-bottom:1px solid var(--ink);padding:26px 0 18px}
.dayhead .place{display:flex;align-items:baseline;gap:14px}
.dayhead .place .kanji{font-size:40px;line-height:1.1;font-weight:500}
.dayhead .place .rom{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dayhead .route{font-size:13px;color:var(--ink2);margin-top:10px}
.dayhead .theme{font-size:16px;margin-top:2px}

/* shift panel */
.shift{background:var(--raise);border:1px solid var(--line);padding:16px;margin:14px 0}
.shift input[type=range]{width:100%;accent-color:var(--ink)}
.shiftval{font:400 22px var(--mono);color:var(--ink)}
.tools{display:flex;gap:18px;margin:14px 0 4px}

/* timetable */
.tl{margin:0}
.it{display:grid;grid-template-columns:58px 1fr;gap:0 14px;padding:14px 0;border-bottom:1px solid var(--line2);position:relative}
.it .t{font:400 15px/1.5 var(--mono);color:var(--ink);padding-top:1px}
.it .t.moved{color:var(--indigo)}
.it .t s{display:block;font-size:11px;color:var(--muted)}
.it.s-book .t{color:var(--accent)}
.it.done .body{opacity:.45}
.it.done .act{text-decoration:line-through;text-decoration-color:var(--muted)}
.it.now .t:before{content:"";position:absolute;left:-12px;top:22px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.it.shifting .t{color:var(--indigo)}
.body{background:none;border:0;padding:0}
.act{font-weight:500;font-size:15px;line-height:1.5}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.note{font-size:13px;margin-top:8px;display:none;color:var(--ink2);border-left:1px solid var(--line);padding-left:12px}
.body.open .note{display:block}
.tick{appearance:none;width:18px;height:18px;border:1px solid var(--muted);border-radius:50%;cursor:pointer;flex:0 0 auto;margin:3px 0 0;background:transparent}
.tick:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.tick:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:16px;margin-top:6px}
.cost{font:400 12px/1.6 var(--mono);white-space:nowrap;text-align:right;color:var(--ink2)}
.cost b{font-weight:500}
.cost .paid,.paid{color:var(--green)}
.orig{color:var(--muted)}
.catpill{font-size:11px;color:var(--muted)}
.add{height:0;position:relative}
.add button{position:absolute;left:22px;top:-11px;width:22px;height:22px;border:0;background:var(--paper);color:var(--line);font:300 18px/22px var(--mono);cursor:pointer;padding:0;z-index:1}
.add button:hover,.add button:focus{color:var(--accent)}
.media{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumb{width:68px;height:68px;overflow:hidden;position:relative;background:var(--line2);cursor:pointer;border:0;padding:0;flex:0 0 auto;border-radius:1px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none}
.thumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:11px;cursor:pointer;line-height:20px;text-align:center}

/* today */
.hero{border-bottom:1px solid var(--ink);padding:30px 0 24px}
.big{font-size:44px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.big.num{font:300 72px/1 var(--mono);letter-spacing:-.04em}
.next{padding:22px 0}
.next .when{font:400 32px/1.1 var(--mono);color:var(--accent)}
.next h3{font-size:19px;font-weight:500;margin:6px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.bk{display:flex;gap:14px;align-items:flex-start}
.bk.done .bt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.filters{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px}
.filters button{border:0;background:none;padding:2px 0;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.filters button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* forms */
.inputs{display:flex;gap:18px;flex-wrap:wrap}
.inputs label,.f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=time],select,textarea{font:400 15px "Zen Kaku Gothic New",sans-serif;letter-spacing:normal;text-transform:none;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
input[type=number],input[type=time]{font-family:var(--mono)}
.inputs input,.inputs select{width:150px}
textarea{min-height:70px;resize:vertical;border:1px solid var(--line);padding:8px 10px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:18px}

/* tables & budget */
table{width:100%;border-collapse:collapse;font:400 12.5px var(--mono)}
th,td{padding:9px 4px;border-bottom:1px solid var(--line2);text-align:right}
th:first-child,td:first-child{text-align:left;white-space:nowrap;font-family:"Zen Kaku Gothic New",sans-serif}
th{font:500 10.5px "Zen Kaku Gothic New",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tfoot td{font-weight:500;border-bottom:0;border-top:1px solid var(--ink)}
.over{color:var(--accent)}.under{color:var(--green)}
.tot{font:300 30px/1.2 var(--mono);letter-spacing:-.02em;margin:4px 0}
.cbar{display:grid;gap:3px;margin:6px 0 16px}
.cbar .tr{height:3px;background:var(--line2);position:relative}
.cbar .e{position:absolute;left:0;top:0;bottom:0;background:var(--muted)}
.cbar .p{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.catrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.catrow input{flex:1}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:40px;letter-spacing:.04em}
.more a{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none}
.more a .kanji{font-size:22px}
.more a span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:22px 20px 28px;border-top:2px solid var(--ink)}
.sheet h2{border:0;margin:0;padding:0;font-size:12px}
@media(min-width:640px){.ov{align-items:center}.sheet{border:1px solid var(--line);border-top:2px solid var(--ink)}}
.f{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.f .full{grid-column:1/-1}
.money{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.money input{grid-column:1/-1}
.fs{border:0;border-top:1px solid var(--line);padding:14px 0 0;margin:0;background:none}
.fs legend{font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 0 0}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{display:none}
.err{color:var(--accent);font-size:12.5px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lb img,.lb video{max-width:100%;max-height:85vh}
.lb button{margin-top:14px;color:#fff;border-color:#fff}
@media(max-width:420px){main{padding-left:16px;padding-right:16px}.big.num{font-size:60px}.dayhead .place .kanji{font-size:34px}}
.upl,.f label.upl{display:inline-flex;flex-direction:row;width:auto;text-transform:none;letter-spacing:.04em;font-size:13px;color:var(--ink);padding:7px 14px}
#e_estconv,#e_paidconv{text-transform:none;letter-spacing:normal;font-family:var(--mono);font-size:11.5px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.tot{font-size:26px}}
.fxlist{margin:0;padding-left:22px}.fxlist li{margin:0 0 10px;font-size:14px;line-height:1.6}.fxlist li::marker{color:var(--muted);font:12px var(--mono)}
.card.fx{border-left:2px solid var(--accent);padding-left:14px}
</style>
</head>

<script>
let DATA = null;
const FACTS = {"fuji": ["Mt Fuji is 3,776 m tall, Japan's highest mountain.", "Mt Fuji is an active volcano. It last erupted in 1707, dropping ash on Edo (Tokyo) about 100 km away.", "The 1707 Hoei eruption began just 49 days after one of Japan's biggest earthquakes.", "Fuji's near-perfect cone is really three volcanoes stacked on top of each other: Komitake, Ko-Fuji (\"Old Fuji\") and Shin-Fuji (\"New Fuji\").", "Fuji's lava is basalt, which is unusual for a cone volcano. It flows more easily, which helps give Fuji its smooth slopes.", "The base of Mt Fuji is roughly 40–50 km across.", "Mt Fuji became a UNESCO World Heritage Site in 2013 as a cultural site, a \"sacred place and source of artistic inspiration\", not as a natural one.", "In Fujisan, \"san\" means mountain. It isn't the polite \"-san\" used with people's names.", "Japanese people rarely say \"Fujiyama\". It's Fujisan.", "Mt Fuji sits on the border of Yamanashi and Shizuoka prefectures, and the border near the summit has never been officially drawn.", "Everything above the 8th station of Mt Fuji is officially owned by the Fujisan Hongu Sengen Taisha shrine.", "Fuji is sacred in Shinto and is home to the goddess Konohanasakuya-hime.", "Legend says the first person to climb Fuji was the mountain ascetic En no Gyoja, around 663.", "Women were banned from climbing Mt Fuji until 1872.", "The climbing season is only July to early September. Outside it, the trails are closed and dangerous.", "About 200,000 people climb Mt Fuji each summer.", "Since 2024, climbers on the popular Yoshida Trail must pay a fee, and there's a daily limit on numbers.", "A Japanese saying goes: \"A wise man climbs Fuji once; only a fool climbs it twice.\"", "Watching sunrise from Fuji's summit is called \"goraiko\", the arrival of the light.", "A summer-only post office operates at the summit of Mt Fuji.", "Water boils at about 87 °C on Fuji's summit because of the low air pressure.", "The average yearly temperature on Fuji's summit is around −6 °C.", "Fuji has four main climbing trails: Yoshida, Subashiri, Gotemba and Fujinomiya.", "Walking around the summit crater is called \"ohachi-meguri\", circling the bowl.", "The highest point, Kengamine, is on the rim of the summit crater.", "A weather radar dome sat on Fuji's summit until 1999. It's now in a museum in Fujiyoshida.", "Mt Fuji's first snowcap usually appears in early autumn, but in 2024 it didn't come until 7 November, the latest on record.", "Fuji is most often visible in the cold, dry months from late autumn to winter, and early mornings are usually clearest.", "A cap-shaped cloud (kasagumo) sitting on Fuji's peak is a local sign that rain is on the way.", "\"Diamond Fuji\" is when the sun rises or sets exactly on the summit, like a sparkling jewel.", "\"Sakasa Fuji\" (upside-down Fuji) is the mirror image of the mountain on a still lake, best on calm early mornings.", "On very clear days, Mt Fuji can be seen from over 300 km away. The record is from Wakayama.", "Hokusai's \"Thirty-six Views of Mount Fuji\", which includes The Great Wave, actually has 46 prints.", "Hokusai's Great Wave, with Fuji in the background, is printed on the back of the new 1,000-yen note issued in 2024.", "The view of Fuji from Lake Motosu is printed on the back of the older 1,000-yen note.", "Japanese passports issued since 2020 have Hokusai's Fuji prints on their visa pages.", "23 February is \"Fuji Day\", because 2-2-3 can be read \"fu-ji-san\".", "Some Fuji worshippers in Edo built mini Fujis (Fujizuka) in Tokyo for people who couldn't make the trip.", "Kawaguchiko is one of the Fuji Five Lakes: Kawaguchi, Yamanaka, Sai, Shoji and Motosu.", "The Fuji Five Lakes were formed when lava flows from Mt Fuji dammed rivers.", "Lakes Sai and Shoji were once part of one big lake, which lava from the 864 Jogan eruption split apart.", "Lake Yamanaka is the largest and highest of the five lakes, at about 980 m.", "Lake Motosu is the deepest of the five lakes, at about 120 m.", "Lake Shoji is the smallest of the Fuji Five Lakes.", "Lake Kawaguchi is the second-largest of the five lakes and the most developed for visitors.", "Unoshima in Lake Kawaguchi is the only island in any of the Fuji Five Lakes.", "The town you're staying in is officially called Fujikawaguchiko.", "In 2024, Fujikawaguchiko town put up a big screen near a Lawson shop to stop crowds photographing Fuji \"on top of\" the convenience store.", "The Kachi Kachi Ropeway is named after \"Kachi-kachi Yama\", a folk tale about a clever rabbit and a mischievous tanuki.", "Kawaguchiko's Momiji Corridor, a tunnel of maple trees on the north shore, is lit up at night during the autumn leaves festival in November.", "Oishi Park's kochia bushes on the lake shore turn bright red in autumn.", "Chureito Pagoda, the five-storey pagoda in the classic Fuji photo, was built in 1963 as a peace memorial.", "Climbing to the Chureito Pagoda viewpoint takes about 400 steps.", "Fujiyoshida's Kitaguchi Hongu Fuji Sengen Shrine is the traditional starting point for pilgrims climbing Fuji.", "Fujiyoshida's huge Fire Festival in late August marks the end of the climbing season.", "The Fuji Excursion limited express has run straight from Shinjuku to Kawaguchiko since 2019.", "The Fuji Subaru Line road climbs to Fuji's 5th station at 2,305 m.", "Narusawa Ice Cave, formed by lava, stays below freezing all year.", "The Fugaku Wind Cave near Lake Sai was used as a natural fridge for storing silkworm eggs.", "At the Funatsu lava tree molds, flowing lava swallowed tree trunks and left hollow tubes behind.", "Oshino Hakkai, near Kawaguchiko, is a cluster of eight ponds fed by snowmelt that has filtered through Fuji's lava for years.", "Yamanashi produces a large share of Japan's bottled mineral water, much of it from Fuji's underground springs.", "Yamanashi is Japan's top producer of grapes and peaches, and it makes a lot of Japan's wine, including the local Koshu grape.", "Hoto is Yamanashi's soul food: thick, flat noodles stewed in miso broth with pumpkin and vegetables.", "Legend says warlord Takeda Shingen fed hoto to his soldiers, cutting the noodles with his sword.", "Yoshida udon from Fujiyoshida is famously firm and chewy, traditionally topped with cabbage.", "Shingen mochi, a Yamanashi sweet, comes as rice cakes in roasted soybean flour that you pour brown sugar syrup over.", "In winter, anglers on Lake Yamanaka fish for wakasagi smelt from heated, domed boats.", "Swans live on Lake Yamanaka, and the tourist boats there are shaped like swans too.", "Fuji-Q Highland near Kawaguchiko is famous for extreme roller coasters and a huge haunted hospital walk-through.", "The Kawaguchiko Music Forest Museum is full of antique music boxes and huge dance organs.", "The Itchiku Kubota Art Museum in Kawaguchiko shows kimono that are each dyed as part of a landscape.", "Mt Fuji appears in poems in the Man'yoshu, Japan's oldest poetry collection, from the 8th century.", "The Mishima Skywalk is Japan's longest pedestrian suspension bridge, at 400 m, with Fuji views.", "Mishima's clear Genbe River is fed by springs of Fuji snowmelt that bubble up in the middle of town.", "Mishima is famous for eel. Locals say the Fuji spring water used to keep the eels cleans out any muddy taste.", "Kakitagawa Springs near Mishima is one of the biggest springs in Japan, gushing about a million tonnes of water a day.", "On the Shinkansen from Tokyo to Kyoto, Mt Fuji appears on the right-hand side (seats D and E).", "Hikers say Mt Fuji looks very different up close: a dark, rocky slope of volcanic gravel rather than a smooth white cone.", "Many sento bathhouses around Japan have a Mt Fuji mural on the wall, so you can \"bathe with Fuji\"."], "kyoto": ["Kyoto, then called Heian-kyo, was Japan's imperial capital from 794 to 1869.", "Kyoto's grid of streets was modelled on Chang'an (today's Xi'an), the capital of Tang-dynasty China.", "Kyoto simply means \"capital city\".", "Kyoto has around 1,600 Buddhist temples and 400 Shinto shrines.", "Kyoto's UNESCO listing covers 17 sites spread across Kyoto, Uji and Otsu.", "Kyoto was taken off the atomic bomb target list in 1945, largely because US Secretary of War Henry Stimson knew and valued the city.", "The Onin War (1467–1477) destroyed much of Kyoto. Locals joke that when they say \"the last war\", they mean that one.", "Fushimi Inari Taisha is famous for its thousands of vermilion torii gates, often said to number around 10,000.", "Each torii at Fushimi Inari is donated by a company or person, and the donor's name and date are written on the back.", "A large torii at Fushimi Inari can cost over a million yen to donate.", "Fushimi Inari is the head shrine of about 30,000 Inari shrines across Japan.", "Inari is the god of rice and business, which is why so many companies donate gates.", "Foxes are Inari's messengers. Many fox statues hold a key in their mouth, said to be the key to the rice granary.", "Inari sushi (rice in fried tofu pouches) is named after Inari, because foxes are said to love fried tofu.", "Fushimi Inari dates back to 711.", "Fushimi Inari never closes and is free, so you can walk the gates early in the morning or at night.", "Hiking to the top of Mt Inari (233 m) and back takes about two to three hours.", "Kiyomizu-dera's famous wooden stage stands about 13 m above the slope on a grid of huge pillars, built without nails.", "\"Jumping off the stage at Kiyomizu\" is a Japanese saying for taking a bold leap. In the Edo period over 200 people actually jumped, and most survived.", "Kiyomizu means \"pure water\". It's named after the Otowa Waterfall below the main hall.", "The Otowa Waterfall has three streams, said to bring long life, love and success in study. Drinking from all three is considered greedy.", "Kiyomizu-dera was founded in 778.", "Kiyomizu-dera holds special night illuminations for the autumn leaves.", "Jishu Shrine at Kiyomizu-dera has two \"love stones\". Walk from one to the other with your eyes closed and you'll find love.", "Legend says if you trip on Sannenzaka slope near Kiyomizu-dera, you'll have three years of bad luck. Shops sell gourd charms to protect you.", "There's a Starbucks on Ninenzaka in a 100-year-old townhouse with tatami seating.", "The Yasaka Pagoda in Higashiyama is a five-storey pagoda about 46 m tall, rebuilt in 1440.", "Yasaka Shrine in Gion is the head of the Gion shrines and runs the Gion Matsuri.", "The Gion Matsuri in July is over 1,100 years old. It began in 869 to calm the gods believed to cause plague.", "In Kyoto, geisha are called geiko, and apprentices are called maiko.", "Some private alleys in Gion are now closed to tourists, and there are fines for trespassing.", "Kinkaku-ji's top two floors are covered in gold leaf. The original pavilion burned down in 1950 and was rebuilt in 1955.", "The Silver Pavilion (Ginkaku-ji) was never covered in silver.", "Ginkaku-ji's cone of sand, Kogetsudai, is said to be for moon viewing.", "Ryoan-ji's famous rock garden has 15 stones, but from any spot on the veranda you can only see 14 at once.", "The Philosopher's Path is named after philosopher Nishida Kitaro, who walked it every day.", "Sanjusangendo houses 1,001 life-size statues of Kannon in a wooden hall 120 m long.", "Toji's five-storey pagoda is Japan's tallest wooden pagoda, at about 55 m.", "A big flea market fills the grounds of Toji on the 21st of every month.", "Nijo Castle has \"nightingale floors\" that chirp when you walk on them, a built-in alarm against intruders.", "At Nijo Castle in 1867, the last shogun announced that he was handing power back to the emperor.", "Higashi Honganji's Founder's Hall is one of the largest wooden buildings in the world.", "To build Higashi Honganji in the 1880s, women donated their hair to make super-strong ropes for hauling timber. One rope is still on display.", "Heian Shrine was built in 1895 for the 1,100th anniversary of the capital. Its giant torii is 24 m tall.", "Kitano Tenmangu enshrines the scholar Sugawara no Michizane and is packed with students praying before exams.", "Saiho-ji, the \"Moss Temple\", has over 100 kinds of moss, and you can only visit with a reservation.", "Late November is peak autumn-leaf season in Kyoto, and places like Eikando and Tofuku-ji get very busy.", "Eikando's main Buddha statue is unusual: it looks back over its shoulder.", "Tofuku-ji's Tsutenkyo Bridge looks out over a valley full of maple trees and is one of Kyoto's most famous autumn views.", "In Arashiyama, Togetsukyo means \"Moon Crossing Bridge\". An emperor named it after the moon seemed to cross over it.", "The sound of wind in Arashiyama's bamboo grove is one of Japan's official \"100 Soundscapes\".", "Some bamboo species can grow nearly a metre in a single day.", "Tenryu-ji in Arashiyama, founded in 1339, ranks first among Kyoto's Five Great Zen temples.", "Tenryu-ji's pond garden was designed by Zen master Muso Soseki and still keeps much of its 14th-century layout.", "At Iwatayama Monkey Park in Arashiyama, the humans go inside a cage to feed the monkeys.", "The Okochi Sanso villa in Arashiyama belonged to silent-film star Denjiro Okochi, who spent 30 years building its gardens.", "The Hozugawa river boat ride runs about two hours down the gorge from Kameoka to Arashiyama.", "Yudofu, gently simmered tofu, is a Kyoto temple dish, especially popular around Arashiyama and Nanzen-ji.", "Kyoto has some of the highest bread spending per household of any city in Japan.", "Nintendo was founded in Kyoto in 1889 as a maker of hanafuda playing cards.", "Kyocera, Murata, Omron, Shimadzu and Wacoal are all headquartered in Kyoto.", "Being offered \"bubuzuke\" (rice with tea poured over it) in a Kyoto home is a famous polite hint that it's time to go home.", "Kyoto addresses often use \"agaru\" (go north) and \"sagaru\" (go south) from the nearest crossroads.", "A traditional children's song, \"Maru Take Ebisu\", lists Kyoto's east-west streets in order so people can remember them.", "Old Kyoto townhouses (machiya) are called \"eel beds\" because they are narrow and deep. Taxes were once based on frontage width.", "Nishiki Market, \"Kyoto's Kitchen\", is a narrow covered street about 400 m long with over 100 shops.", "Pontocho alley's name may come from the Portuguese word \"ponto\", meaning point.", "Couples sitting along the Kamo River tend to space themselves at almost equal distances, a habit locals call the \"Kamogawa equal-spacing rule\".", "Turtle-shaped stepping stones cross the Kamo River at Demachiyanagi.", "Shijo-Karasuma, near your hotel, is Kyoto's main business and banking district.", "Kyoto's townscape rules limit building heights and colours, so even McDonald's and convenience-store signs are toned down.", "Kyoto Tower, 131 m tall, opened in 1964 and is the tallest structure in the city.", "Kyoto Station's huge glass building (1997) has a 171-step \"Grand Stairway\" that lights up with LED displays at night.", "The Kyoto Imperial Palace was the emperor's home until 1869, and the Taisho and Showa emperors were enthroned there.", "Kyoto's Gozan Okuribi in August lights giant bonfire characters on the mountains around the city.", "Kyoto's three big festivals are Aoi Matsuri (May), Gion Matsuri (July) and Jidai Matsuri (October).", "The Kyoto Protocol climate treaty was agreed in Kyoto in 1997.", "Kyoto University's Hideki Yukawa became Japan's first Nobel Prize winner in 1949.", "The Urasenke and Omotesenke tea ceremony schools are both based in Kyoto.", "Ichiwa, a shop near Imamiya Shrine, has sold grilled rice cakes since around the year 1000, making it one of the oldest businesses in the world.", "Yatsuhashi, cinnamon-flavoured rice-flour sweets, is Kyoto's classic souvenir.", "Saba-zushi (mackerel sushi) became a Kyoto speciality thanks to the \"Mackerel Road\" that brought salted fish from the coast.", "Kyo-yasai are Kyoto's heirloom vegetables, like round Kamo eggplant and Kujo green onions.", "Nishijin in Kyoto has been famous for silk weaving for over 500 years.", "The Kyoto International Manga Museum is in a former elementary school and holds about 300,000 items.", "Japan's first electric streetcar ran in Kyoto in 1895.", "Kyoto is the setting of the novel and film Memoirs of a Geisha.", "Kyoto's Kamo River is so clean that you can sometimes see herons and ducks fishing in the middle of the city.", "Arashiyama's Sagano Romantic Train is an old-style sightseeing train along the Hozugawa gorge.", "Kyoto's machiya often have narrow inner gardens called tsuboniwa to let in light and air.", "Matcha sweets are everywhere in Kyoto because Uji, Japan's most famous tea town, is right next door."], "nara": ["Nara, then called Heijo-kyo, was Japan's capital from 710 to 784.", "Japan's oldest surviving histories, the Kojiki (712) and Nihon Shoki (720), were written during the Nara period.", "The Man'yoshu, Japan's oldest poetry collection, comes from the Nara period. The current era name \"Reiwa\" was taken from it.", "Nara's UNESCO listing, \"Historic Monuments of Ancient Nara\", covers eight sites.", "About 1,300 wild sika deer roam Nara Park.", "According to legend, the god of Kasuga Taisha arrived in Nara riding a white deer, so deer are seen as sacred messengers.", "Nara's deer are a protected Natural Monument. Historically, killing one could be punished by death.", "Nara's deer are wild. Nobody owns them, but they're used to people.", "Many Nara deer have learned to bow for shika senbei, special deer crackers.", "Shika senbei are made from wheat flour and rice bran, with no sugar, so they're safe for deer.", "A deer's \"bow\" can also be a warning before a headbutt. Show empty hands when you've run out of crackers.", "Autumn is rutting season, so male deer can be more pushy in October and November.", "Every October, the male deer's antlers are cut off in a ceremony that has been held since the 1600s.", "Plastic bags are dangerous for Nara's deer because they sometimes eat them. Keep your rubbish in your bag.", "Nara's deer are often seen waiting at pedestrian crossings.", "Nara Park covers about 660 hectares, including the temple and shrine grounds.", "Todai-ji means \"Great Eastern Temple\".", "Todai-ji's Great Buddha is about 15 m tall and one of the largest bronze Buddhas in the world.", "Making the Great Buddha in the 8th century used up a huge share of Japan's copper.", "The Great Buddha was opened in 752 when an Indian monk painted in its eyes, holding a brush tied to long cords that the crowd also held.", "The Great Buddha has been damaged by fire and earthquakes. Its current head dates from the 1690s.", "Todai-ji's Great Buddha Hall is one of the largest wooden buildings in the world, even though today's 1709 hall is about a third smaller than the original.", "A pillar in the Great Buddha Hall has a hole the same size as the Buddha's nostril. Crawling through it is said to bring enlightenment.", "The two 8 m wooden guardians in Todai-ji's Nandaimon gate were carved by Unkei and Kaikei's team in about 70 days in 1203.", "Todai-ji's Omizutori fire ritual in March has been held every year since 752 without a break.", "Todai-ji's Nigatsu-do hall has a free wooden veranda with a wide view over Nara.", "The monk Gyoki raised money from ordinary people to build the Great Buddha. His statue stands outside Kintetsu Nara Station.", "Shosoin, Todai-ji's treasure house, holds 8th-century objects, including glass and instruments that came along the Silk Road.", "Some Shosoin treasures go on show at the Nara National Museum each autumn.", "Kasuga Taisha was founded in 768 by the powerful Fujiwara clan.", "Kasuga Taisha has about 3,000 lanterns, and they're all lit only twice a year, in February and August.", "The Kasugayama Primeval Forest behind the shrine has been protected from logging since 841.", "Kofuku-ji was the Fujiwara family temple.", "Kofuku-ji's five-storey pagoda, about 50 m tall, is Japan's second-tallest wooden pagoda. It is under major repair until the early 2030s.", "Kofuku-ji's Ashura statue, from 734, has three faces and six arms and is one of Japan's best-loved Buddhist statues.", "Horyu-ji, near Nara, has the world's oldest surviving wooden buildings, from around the 7th century.", "Some roof tiles at Gango-ji in Nara date from the late 6th century and are among the oldest still in use in Japan.", "Naramachi, Nara's old merchant quarter, has red cloth monkey charms (migawari-zaru) hanging under the eaves to keep bad luck away.", "Wakakusayama, the grassy hill in Nara Park, is set on fire every January in the Yamayaki festival.", "Isuien garden uses \"borrowed scenery\": Todai-ji's gate and the hills behind it look like part of the garden.", "The reconstructed Suzaku Gate and Great Hall at the Heijo Palace site show how big Nara's old palace was.", "Nakatanidou, a mochi shop in Nara, is famous for super-fast mochi pounding.", "Nara's mascot Sento-kun, a boy Buddha with deer antlers, was controversial at first but became popular.", "Kakinoha-zushi, sushi wrapped in persimmon leaves, is a Nara speciality.", "Nara is one of Japan's top persimmon producers.", "Narazuke are vegetables pickled in sake lees, a Nara speciality.", "Miwa somen, thin wheat noodles from Sakurai in Nara, are said to be the origin of somen in Japan.", "Shoryaku-ji in Nara is said to be where important sake brewing methods were developed in the Middle Ages.", "Nara makes about 90% of Japan's solid ink sticks (sumi) for calligraphy.", "Yamatokoriyama in Nara is Japan's goldfish capital and hosts a national goldfish-scooping championship.", "Yoshino in Nara has about 30,000 cherry trees on its mountain slopes.", "Yoshino kudzu starch is used in fine Japanese sweets.", "The Nara Hotel, opened in 1909, has hosted guests including Albert Einstein and Audrey Hepburn.", "Asuka, south of Nara, has Ishibutai, a huge stone tomb from the 7th century with its earth mound gone.", "The tomb of Emperor Jimmu, Japan's legendary first emperor, is in Kashihara, Nara.", "Nara is about 45 minutes from Kyoto by Kintetsu train.", "Park rangers sometimes call the deer by blowing a horn in events called \"shika-yose\", and herds come running.", "Nara's deer are counted every year, and their numbers have grown in recent years.", "Deer-crossing road signs are everywhere in Nara Park.", "Some Nara deer like to nap right in the middle of temple paths."], "otaru": ["Otaru's name comes from an Ainu word for a river flowing through sandy ground.", "Otaru Canal was completed in 1923 and is about 1.1 km long.", "Otaru Canal was made by filling in land along the shore rather than by digging, which is why it curves gently.", "In the 1980s, half of Otaru Canal was filled in for a road. Local residents campaigned to save the rest.", "Otaru Canal has about 63 gas lamps, which are lit at dusk.", "The old stone warehouses along the canal are now restaurants, shops and a beer hall.", "Otaru was once Hokkaido's financial centre and was nicknamed \"the Wall Street of the North\".", "Otaru grew rich as a port for herring fishing and coal shipping.", "Herring barons built huge \"herring mansions\" (nishin goten) along the coast near Otaru.", "The former Bank of Japan Otaru branch (1912) was designed by Tatsuno Kingo, the architect of Tokyo Station. It's now a free museum.", "Otaru's glass industry started in the Meiji period by making oil lamps and glass fishing floats.", "Kitaichi Glass began in 1901 making oil lamps and fishing floats.", "Kitaichi Hall is lit only by 167 oil lamps.", "Sakaimachi Street is Otaru's main shopping street for glass, music boxes and sweets.", "The Otaru Music Box Museum's main hall, from 1912, is packed with tens of thousands of music boxes.", "The steam clock outside the Otaru Music Box Museum was made by Raymond Saunders, the Vancouver clockmaker behind Gastown's famous steam clock, and it whistles every 15 minutes.", "LeTAO's \"Double Fromage\" cheesecake is Otaru's most famous sweet.", "Otaru is known for its sushi, and has a street lined with sushi restaurants.", "Naruto in Otaru serves \"half chicken\", half a chicken deep-fried whole.", "Ankake yakisoba, fried noodles topped with thick gravy, is Otaru's local comfort food.", "Panju, small pancake sweets filled with red bean, are a classic Otaru snack.", "Otaru Beer is brewed using German methods under the strict Reinheitsgebot purity law.", "Hokkaido's first railway, opened in 1880, ran between Otaru and Sapporo. Part of the old Temiya Line is now a walking path.", "On the train from Sapporo to Otaru, sit on the right side for views of the sea.", "Otaru is about 30–45 minutes from Sapporo by JR train.", "Otaru is a key setting for Shunji Iwai's 1995 film \"Love Letter\", which is very popular in Asia.", "The Otaru Snow Light Path festival in February fills the canal and streets with candles in snow lanterns.", "The Mt Tengu ropeway has views over Otaru and the bay, and there's a hall full of long-nosed tengu masks at the top.", "The Nikka Whisky Yoichi Distillery, founded by Masataka Taketsuru, is about 25 minutes from Otaru.", "Taketsuru and his Scottish wife Rita inspired the popular TV drama \"Massan\".", "Shakotan, near Otaru, is famous for sea urchin (uni) in summer.", "Otaru's population peaked at around 200,000 in the 1960s. Today it's about 110,000.", "Otaru Suitengu Shrine sits on a hill with views over the port.", "Otaru has many Western-style stone buildings from its banking boom.", "Many of Otaru's old warehouses were built of stone partly to protect goods from fire.", "Hand-blown glass workshops in Otaru let visitors try glassblowing or make glass beads.", "Otaru's music box shops will let you choose the tune for a custom music box.", "The Kitaichi Venetian Art Museum has a full-size gondola and Venetian glass.", "Otaru's canal is especially pretty at dusk, when the gas lamps come on and the warehouses are lit up."], "sapporo": ["Sapporo was laid out as a planned city from 1869, which is why its streets form a neat grid.", "Sapporo's name comes from Ainu words often explained as \"dry, great river\".", "Sapporo addresses work like coordinates, such as \"North 3, West 4\", counted from Odori Park and the Sosei River.", "Sapporo is Japan's fifth-largest city, with about 2 million people.", "Sapporo gets around 5 m of snow a year, a huge amount for a city of its size.", "Sapporo hosted the 1972 Winter Olympics, the first Winter Games held in Asia.", "The Okurayama ski jump, used at the 1972 Olympics, has a viewing deck at the top where you can see the drop.", "Sapporo Snow Festival began in 1950, when local high school students built six snow statues in Odori Park.", "Japan's Self-Defense Forces help build the giant snow sculptures for the Snow Festival.", "Odori Park is a long green strip about 1.5 km long that divides Sapporo into north and south.", "The Sapporo White Illumination, which lights up Odori Park from late November, was Japan's first big winter light-up event (1981).", "The Munich Christmas Market fills Odori Park from late November. Munich is Sapporo's sister city.", "Sapporo TV Tower, at the east end of Odori Park, is 147 m tall and has a giant digital clock.", "Sapporo TV Tower's mascot is \"Terebi-tou-san\", a tower with a face (the name means Mr TV Father).", "The Sapporo Clock Tower (1878) is one of Japan's oldest clock towers. It's often jokingly called one of Japan's most disappointing sights because it's so small.", "The Clock Tower's clock was made by E. Howard & Co. of Boston and still chimes on the hour.", "The Clock Tower was originally the drill hall of Sapporo Agricultural College.", "American educator William S. Clark helped found Sapporo Agricultural College (now Hokkaido University) in 1876.", "Clark's parting words to his students, \"Boys, be ambitious!\", are still famous in Japan.", "The statue of Clark at Hitsujigaoka Observation Hill points into the distance.", "Sapporo Beer const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const ls = {
  get(k, d){ try { const v = localStorage.getItem('jp26:'+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('jp26:'+k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- categories ---------- */
const DEFAULT_CATS = [
  {id:'transport', name:'Transport'}, {id:'food', name:'Food & drink'}, {id:'attractions', name:'Attractions & tickets'},
  {id:'shopping', name:'Shopping'}, {id:'accommodation', name:'Accommodation'}, {id:'flights', name:'Flights'},
  {id:'luggage', name:'Luggage & lockers'}, {id:'other', name:'Other'}
];
function guessCat(it){
  const a = (it.act+' '+it.mode).toLowerCase();
  if (/flight|vj8|pr4|pr5|mm115/.test(a)) return 'flights';
  if (/locker/.test(a)) return 'luggage';
  if (/breakfast|lunch|dinner|snack|café|cafe|coffee|dessert|seafood|matcha|food|market breakfast/.test(a) && !/→/.test(it.area)) return 'food';
  if (/shopping|thrift|don quijote|shop/.test(a) && !/→/.test(it.area)) return 'shopping';
  if (/→/.test(it.area) || /train|bus|subway|jr |shinkansen/.test(a)) return 'transport';
  if (/ticket|sky|ropeway|byodoin|todai|tenryu|garden|gyoen|kiyomizu|okochi|admission|museum|cruise|park/.test(a)) return 'attractions';
  return 'other';
}

/* ---------- state ---------- */
let S = {
  settings: ls.get('settings', null) || { fx: ls.get('fx',110), people: ls.get('people',2), snow: ls.get('snow','A'), cats: DEFAULT_CATS, bdone: ls.get('bdone',{}) },
  days: ls.get('days', {}),         // date -> {ov:{}, custom:{}}
  pre: ls.get('pre', {items:{}}),    // costs before the trip
  ui: { day:null, bfilter:'all', shift:null, open:{} },
  db:null, assets:null, canWrite:true, mode:'local'
};
const ST = () => S.settings;
const catName = id => (ST().cats.find(c=>c.id===id) || ST().cats.find(c=>c.id==='other') || {name:'Other'}).name;
const catExists = id => ST().cats.some(c=>c.id===id);

const CURS = ['IDR','JPY','MYR','SGD'];
const DEFAULT_RATES = {JPY:110, MYR:4400, SGD:13900};
function rates(){ const r = ST().rates || {}; return {IDR:1, JPY:+r.JPY || +ST().fx || 110, MYR:+r.MYR || 4400, SGD:+r.SGD || 13900}; }
let DISP = ls.get('disp','IDR'); if (!CURS.includes(DISP)) DISP = 'IDR';
function fmtCur(a, cur){
  if (cur==='IDR') return 'Rp' + Math.round(a).toLocaleString('id-ID');
  if (cur==='JPY') return '¥' + Math.round(a).toLocaleString('en-US');
  const s = a.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (cur==='MYR' ? 'RM' : 'S$') + s;
}
const fmtR = idr => fmtCur(idr / rates()[DISP], DISP);      // any IDR amount -> display currency
const fmtJ = n => '¥' + Math.round(n).toLocaleString('en-US');
const toIdr = m => !m || !m.amt ? 0 : m.amt * (rates()[m.cur] || 1);   // one unit as entered
const mTotal = m => toIdr(m) * (m && m.basis==='pp' ? ST().people : 1); // whole group
function showMoney(m, label, cls=''){
  if (!m || !m.amt) return '';
  const b = m.basis==='pp' ? ' pp' : ' total';
  const orig = m.cur!==DISP ? ` <span class="orig">(${fmtCur(m.amt, m.cur)})</span>` : '';
  return `<span class="${cls}">${label} ${fmtR(toIdr(m))}${b}</span>${orig}`;
}
const short = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const wk = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||''); return m ? +m[1]*60 + +m[2] : null; };
const fromMin = m => { m = Math.max(0, Math.min(23*60+59, Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };

/* ---------- effective items ---------- */
function dayDoc(date){ return S.days[date] || {ov:{}, custom:{}}; }
function items(i, {withShift=true, includeRemoved=false}={}){
  const d = DATA.days[i], doc = dayDoc(d.date);
  let list = d.items.map((b,k)=>{
    const base = { id:'b'+k, k, base:true, time:b.time, origTime:b.time, area:b.area, act:b.act, mode:b.mode, dur:b.dur, ticket:b.ticket, status:b.status, note:b.note, src:b.src,
      est: b.jpy ? {amt:b.jpy, cur:'JPY'} : (b.idr ? {amt:b.idr, cur:'IDR'} : {amt:0, cur:'JPY'}),
      paid:{amt:0, cur:'JPY'}, cat: guessCat(b), media:[], noteMedia:[], done:false, removed:false, snowOpt: /^OPTION [ABC]/.test(b.act) ? b.act[7] : null };
    return normMoney(Object.assign(base, doc.ov?.['b'+k] || {}));
  });
  Object.entries(doc.custom || {}).forEach(([id,c])=> list.push(normMoney(Object.assign({id, k:999, base:false, status:'Custom', est:{amt:0,cur:'JPY'}, paid:{amt:0,cur:'JPY'}, cat:'other', media:[], noteMedia:[]}, c))));
  if (!includeRemoved) list = list.filter(x=>!x.removed);
  list.sort((a,b)=> (toMin(a.time)??9999)-(toMin(b.time)??9999) || a.k-b.k);
  const sh = S.ui.shift;
  if (withShift && sh && sh.day===i && sh.mins){
    const from = list.findIndex(x=>x.id===sh.from);
    if (from>=0) list.forEach((x,n)=>{ if(n>=from && toMin(x.time)!==null){ x.preview = fromMin(toMin(x.time)+sh.mins); x.shifting = true; } });
  }
  return list;
}
const countsEst = it => !it.snowOpt || it.snowOpt===ST().snow;
function normMoney(it){
  it.est = Object.assign({amt:0, cur:'JPY'}, it.est); it.est.basis = it.est.basis || 'pp';
  it.paid = Object.assign({amt:0, cur:'JPY'}, it.paid); it.paid.basis = it.paid.basis || 'total';
  it.media = it.media || []; it.noteMedia = it.noteMedia || [];
  return it;
}
function preItems(){ return Object.entries(S.pre.items || {}).map(([id,x])=>normMoney(Object.assign({id, kind:'pre', name:'', cat:'other', note:''}, clone(x)))).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name)); }
function preTotals(){ const l = preItems(); return { est: l.reduce((a,x)=>a+mTotal(x.est),0), paid: l.reduce((a,x)=>a+mTotal(x.paid),0), estPaid: l.filter(x=>x.paid.amt).reduce((a,x)=>a+mTotal(x.est),0) }; }

function writeDoc(path, body){
  if (!S.db){ return Promise.resolve(); }

/* Supabase: a small adapter with the same shape the app already uses */
function sbAdapter(sb){
  const cache = new Map(), docL = new Map(), colL = [];
  const snapOf = p => { const has = cache.has(p); return { id: p.split('/').slice(1).join('/'), exists: has, data: () => has ? cache.get(p) : undefined, metadata:{fromCache:false, hasPendingWrites:false} }; };
  const emitDoc = p => (docL.get(p)||[]).forEach(f=>f(snapOf(p)));
  const emitCol = c => colL.filter(l=>l.c===c).forEach(l=>{ const docs = [...cache.keys()].filter(k=>k.startsWith(c+'/')).map(snapOf); l.f({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false}}); });
  const emitAll = () => { [...docL.keys()].forEach(emitDoc); [...new Set(colL.map(l=>l.c))].forEach(emitCol); };
  const toErr = e => ({ code: (e && (e.code==='42501' || /row-level security/i.test(e.message||''))) ? 'invalid_argument' : 'unavailable', message: e && e.message });
  async function load(){
    const { data, error } = await sb.from('trip_docs').select('path,data');
    if (error) throw toErr(error);
    cache.clear(); data.forEach(r=>cache.set(r.path, r.data)); emitAll();
  }
  sb.channel('trip_docs').on('postgres_changes', {event:'*', schema:'public', table:'trip_docs'}, ev=>{
    const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); if (!p) return;
    if (ev.eventType === 'DELETE') cache.delete(p); else cache.set(p, ev.new.data);
    emitDoc(p); emitCol(p.split('/')[0]);
  }).subscribe(st=>{ if (st==='SUBSCRIBED') load().catch(()=>{}); });
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') load().catch(()=>{}); });
  const db = {
    doc: path => ({
      async set(body){ cache.set(path, body); const { error } = await sb.from('trip_docs').upsert({path, data:body}); if (error) throw toErr(error); },
      async delete(){ cache.delete(path); const { error } = await sb.from('trip_docs').delete().eq('path', path); if (error) throw toErr(error); },
      onSnapshot(f){ docL.set(path, [...(docL.get(path)||[]), f]); if (cache.size) f(snapOf(path)); return ()=>{}; }
    }),
    collection: c => ({ onSnapshot(f){ colL.push({c, f}); if (cache.size) emitCol(c); return ()=>{}; } })
  };
  const assets = {
    async upload(blob){
      const ext = ((blob.type||'').split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5) || 'bin';
      const key = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from('trip-media').upload(key, blob, {contentType: blob.type || undefined, upsert:false});
      if (error) throw error;
      const id = 'sb:'+key;
      const s = await sb.storage.from('trip-media').createSignedUrl(key, 60*60*24);
      if (s.data) SIGNED[id] = s.data.signedUrl;
      return { id, url: undefined, sizeBytes: blob.size, contentType: blob.type };
    },
    async delete(id){ if (id && id.startsWith('sb:')) await sb.storage.from('trip-media').remove([id.slice(3)]); }
  };
  return { db, assets, load, cache };
}

function loadScript(src){ return new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

/* ---------- Japan clock ---------- */
function jpNow(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date:`${g('year')}-${g('month')}-${g('day')}`, mins:(+g('hour')%24)*60 + +g('minute'), hm:`${String(+g('hour')%24).padStart(2,'0')}:${g('minute')}` };
}
const dayIndexForDate = d => DATA.days.findIndex(x=>x.date===d);
const WK_JA = ['日','月','火','水','木','金','土'];
const wkJa = d => WK_JA[new Date(d+'T00:00:00').getDay()];
function region(d){
  const n = DATA.days.findIndex(x=>x.date===d);
  if (n<=0) return ['移動','Travel'];
  if (n===DATA.days.length-1) return ['帰路','Homeward'];
  const s = (DATA.days[n].stay||'').toLowerCase();
  if (s.includes('akabane')) return ['東京','Tokyo'];
  if (s.includes('eirin')) return ['河口湖','Kawaguchiko'];
  if (s.includes('webase')) return ['京都','Kyoto'];
  if (s.includes('quintessa')) return ['札幌','Sapporo'];
  return ['旅','Japan'];
}

function vBudget(){

  const byCat = {};
  const addCat = (it, inc) => { const c = catExists(it.cat) ? it.cat : 'other'; byCat[c] = byCat[c] || {est:0, paid:0}; if (inc) byCat[c].est += mTotal(it.est); byCat[c].paid += mTotal(it.paid); };

  const cats = st.cats.filter(c=>byCat[c.id] && (byCat[c.id].est || byCat[c.id].paid));
  const maxC = Math.max(1, ...cats.map(c=>Math.max(byCat[c.id].est, byCat[c.id].paid)));

  const ro = !S.canWrite;
  return `<h2>Budget</h2>

  <div class="grid2">
    <div class="card"><div class="muted small">Estimated · whole trip</div><div class="tot">${fmtR(est)}</div><div class="small muted">${fmtR(est/st.people)} per person</div></div>
    <div class="card"><div class="muted small">Actually paid so far</div><div class="tot" style="color:var(--green)">${fmtR(paid)}</div><div class="small muted">${paid ? Math.round(paid/est*100)+'% of the estimate · '+fmtR(paid/st.people)+' pp' : 'Add costs with Edit on any stop'}</div></div>
  </div>
  <h2>Before the trip</h2>
  <p class="small muted" style="margin-top:-6px">Hotels, flights, insurance, visa, SIM, rail passes — anything paid or planned before you leave.</p>
  ${pre.map(x=>`<div class="card"><div class="row sp" style="align-items:flex-start;flex-wrap:nowrap">
      <div style="min-width:0"><h3 style="margin:0">${esc(x.name)}</h3><div class="meta">${esc(catName(x.cat))}${x.date?' · '+esc(x.date):''}${x.note?' · '+esc(x.note.slice(0,60)):''}</div></div>
      <span class="cost">${x.est.amt?showMoney(x.est,'Est'):'<span class="muted">No estimate</span>'}${x.paid.amt?'<br>'+showMoney(x.paid,'Paid','paid'):''}</span></div>
      ${thumbs(x.noteMedia,false)}
      ${ro?'':`<div class="acts"><button class="lnk" data-preedit="${esc(x.id)}">Edit</button></div>`}</div>`).join('') || '<div class="card small muted">Nothing yet.</div>'}
  ${ro?'':`<div style="margin-top:14px"><button class="btn" data-preadd>Add pre-trip cost</button></div>`}
  <h2>By day</h2>
  <div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>Day</th><th>Estimated</th><th>Paid</th><th>Over / under*</th></tr></thead>
    <tbody><tr><td><b>Before trip</b></td><td>${fmtR(pt.est)}</td><td>${pt.paid?fmtR(pt.paid):'<span class="muted">—</span>'}</td><td>${diff(pt.estPaid,pt.paid)}</td></tr>
    ${rows.map(r=>`<tr><td><a href="#itinerary" data-goto="${r.i}">${short(r.d.date)}</a></td><td>${fmtR(r.est)}</td><td>${r.paid?fmtR(r.paid):'<span class="muted">—</span>'}</td><td>${diff(r.estPaid,r.paid)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${fmtR(est)}</td><td>${fmtR(paid)}</td><td>${diff(estPaid,paid)}</td></tr></tfoot>
  </table><p class="small muted" style="margin:8px 0 0">* Compares what you paid against the estimate for the same items only, so unpaid items don't count as savings.</p></div>
  <h2>By category</h2>
  <div class="card">
    <div class="legend" style="margin-bottom:10px"><span><i style="background:#c9bfae"></i>Estimated</span><span><i style="background:var(--red)"></i>Paid</span></div>
    ${cats.map(c=>{ const v = byCat[c.id]; return `<div class="row sp small"><b>${esc(c.name)}</b><span class="cost">${fmtR(v.est)} est · <span class="paid">${fmtR(v.paid)}</span></span></div>
      <div class="cbar"><div class="tr"><div class="e" style="width:${(v.est/maxC*100).toFixed(1)}%"></div></div><div class="tr"><div class="p" style="width:${(v.paid/maxC*100).toFixed(1)}%"></div></div></div>`; }).join('') || '<div class="muted small">No costs yet.</div>'}

function startE(o){ E = Object.assign({uploaded:[], removed:[], busy:0, err:'', delArm:false, newCat:false}, o); renderModal(); }

      ${pre ? '' : `<fieldset class="fs full"><legend>Trip photos &amp; videos</legend>${uploadUI('media','Add photos / videos','image/*,video/*','Up to 20 MB per file; large photos are resized automatically.')}</fieldset>`}
    </div>
    ${E.err?`<p class="err">${esc(E.err)}</p>`:''}
    <div class="row sp" style="margin-top:16px">
      <span class="row" style="gap:8px">${E.isNew?'':`<button class="btn red ${E.delArm?'arm':''}" data-edel>${E.delArm?'Tap again to confirm':(E.base?'Remove from plan':'Delete')}</button>`}
        ${E.base && !E.isNew ? `<button class="btn" data-ereset>Reset to original</button>`:''}</span>
      <span class="row" style="gap:8px"><button class="btn" data-ecancel>Cancel</button><button class="btn pri" data-esave ${E.busy?'disabled':''}>Save</button></span>
    </div></div></div>`;
}
function readForm(){
  if (!E) return;
  const v = id => $('#'+id) ? $('#'+id).value : undefined;
  const d = E.draft;
  if (E.kind==='pre'){ d.name = (v('e_name')||'').trim(); d.date = v('e_date')||''; }
  else { d.time = v('e_time') || d.time; d.status = v('e_status'); d.act = (v('e_act')||'').trim(); d.area = v('e_area'); d.mode = v('e_mode'); }
  d.note = v('e_note');
  d.est = {amt: +v('e_est') || 0, cur: v('e_estc'), basis: v('e_estb')};
  d.paid = {amt: +v('e_paid') || 0, cur: v('e_paidc'), basis: v('e_paidb')};
  const c = v('e_cat'); if (c && c!=='__new') d.cat = c;
}
async function compress(file){
  if (!file.type.startsWith('image/') || file.size < 1.5e6 || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch(e){ return file; }
}
async function upload(files, field){
  readForm(); E.err = '';
  const allowVideo = field==='media';
  for (const f of files){
    if (!(f.type.startsWith('image/') || (allowVideo && f.type.startsWith('video/')))){ E.err = `${f.name}: ${allowVideo?'only photos and videos':'only pictures'} here.`; renderModal(); continue; }
    E.busy++; renderModal();
    const mine = E;
    try {
      const blob = await compress(f);
      if (blob.size > 20*1024*1024){ mine.err = `${f.name} is ${(blob.size/1048576).toFixed(0)} MB — over the 20 MB limit. Trim or compress it first.`; }
      else {
        const r = await S.assets.upload(blob);
        mine.draft[field].push({id:r.id, url:r.url, type: f.type.startsWith('video') ? 'video':'image', name:f.name});
        mine.uploaded.push(r.id);
        if (E !== mine) { try{ S.assets.delete(r.id); }catch(_){} }
      }
    } catch(e){ mine.err = `Couldn't upload ${f.name}${e && e.message ? ': '+e.message : ''}.`; }
    mine.busy--; if (E === mine) renderModal();
  }
}
function dropAssets(ids){ ids.forEach(id=>{ try{ S.assets && S.assets.delete(id); }catch(e){} }); }
function saveEdit(){
  readForm();
  const d = E.draft;
  if (E.kind==='pre'){
    if (!d.name){ E.err = 'Give it a name.'; renderModal(); return; }
    S.pre = clone(S.pre) || {items:{}}; S.pre.items = S.pre.items || {};
    S.pre.items[E.id] = {name:d.name, cat:d.cat, date:d.date, note:d.note, est:d.est, paid:d.paid, noteMedia:d.noteMedia, order:d.order};
    dropAssets(E.removed); E = null; renderModal(); route(); savePre(); return;
  }
  if (!d.act){ E.err = 'Give the stop a name.'; renderModal(); return; }
  const date = DATA.days[E.i].date;
  const doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov || {}; doc.custom = doc.custom || {};
  const patch = {time:d.time, act:d.act, area:d.area, mode:d.mode, note:d.note, status:d.status, est:d.est, paid:d.paid, cat:d.cat, media:d.media, noteMedia:d.noteMedia};
  if (E.base) doc.ov[E.id] = Object.assign(doc.ov[E.id]||{}, patch);
  else doc.custom[E.id] = Object.assign(doc.custom[E.id]||{done:false}, patch);
  dropAssets(E.removed); E = null; renderModal(); route(); saveDay(date);
}
function cancelEdit(){ if (E) dropAssets(E.uploaded); E = null; renderModal(); }
function deleteEdit(){
  if (E.kind==='pre'){
    const x = S.pre.items?.[E.id]; S.pre = clone(S.pre); delete S.pre.items[E.id];
    dropAssets([...(x?.noteMedia||[]).map(m=>m.id), ...E.uploaded]); E = null; renderModal(); route(); savePre(); return;
  }
  const date = DATA.days[E.i].date, doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{}; doc.custom = doc.custom||{};
  if (E.base) doc.ov[E.id] = Object.assign(doc.ov[E.id]||{}, {removed:true});
  else { const c = doc.custom[E.id]; dropAssets([...(c?.media||[]), ...(c?.noteMedia||[])].map(m=>m.id)); dropAssets(E.uploaded); delete doc.custom[E.id]; }
  E = null; renderModal(); route(); saveDay(date);
}

/* ---------- fun facts ---------- */
const FX_PLACES = [
  {id:'tokyo', name:'Tokyo', kw:/tokyo|akabane|shinjuku|harajuku|asakusa|ueno|ginza|marunouchi|shimokitazawa|shibuya|hnd/i},
  {id:'fuji', name:'Kawaguchiko & Mt Fuji', kw:/kawaguchiko|fuji|mishima/i},
  {id:'kyoto', name:'Kyoto', kw:/kyoto|shijo|fushimi|higashiyama|arashiyama/i},
  {id:'uji', name:'Uji', kw:/\buji\b/i},
  {id:'nara', name:'Nara', kw:/\bnara\b/i},
  {id:'sapporo', name:'Sapporo & Hokkaido', kw:/sapporo|susukino|odori|tanukikoji|cts|hokkaido/i},
  {id:'otaru', name:'Otaru', kw:/otaru/i},
];
function fxPlacesForDay(i){
  const d = DATA.days[i], txt = [d.route, d.stay, d.title, d.theme].join(' ');
  if (i===0) return ['tokyo'];
  return FX_PLACES.filter(p=>p.kw.test(txt)).map(p=>p.id);
}
function fxPool(ids){ const out=[]; ids.forEach(id=>(FACTS[id]||[]).forEach(t=>out.push({id,t}))); return out; }
function fxName(id){ return (FX_PLACES.find(p=>p.id===id)||{}).name||id; }
function funCard(key, ids){
  const pool = fxPool(ids); if (!pool.length) return '';
  S.ui.fx = S.ui.fx || {};
  if (S.ui.fx[key] === undefined){ let h=0; for (const c of String(key)+jpNow().date) h=(h*31+c.charCodeAt(0))>>>0; S.ui.fx[key] = h % pool.length; }
  const f = pool[S.ui.fx[key] % pool.length];
  return `<div class="card fx"><div class="row sp" style="align-items:baseline"><span class="lbl" style="color:var(--accent)">Did you know · ${esc(fxName(f.id))}</span>
    <button class="lnk small" data-fx="${esc(String(key))}" data-fxn="${pool.length}">Another →</button></div>
    <div style="margin-top:6px">${esc(f.t)}</div></div>`;
}
function vFacts(){
  const sel = S.ui.fxPlace || 'tokyo', list = FACTS[sel] || [];
  const total = FX_PLACES.reduce((a,p)=>a+(FACTS[p.id]||[]).length,0);
  return `<h2>Fun facts</h2><p class="small muted" style="margin:-6px 0 12px">${total} facts about the places on your trip.</p>
    <div class="filters">${FX_PLACES.map(p=>`<button data-fxplace="${p.id}" class="${p.id===sel?'on':''}">${esc(p.name)} <span class="muted">${(FACTS[p.id]||[]).length}</span></button>`).join('')}</div>
    <div class="card"><ol class="fxlist">${list.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;
}
function vMore(){
  return `<h2>More</h2><div class="more">
    <a href="#stays"><span class="kanji">宿 · 便</span><span>Stays &amp; flights</span></a>
    <a href="#tips"><span class="kanji">心得</span><span>Tips</span></a>
    <a href="#facts"><span class="kanji">豆知識</span><span>Fun facts</span></a>
    <a href="#settings"><span class="kanji">設定</span><span>Settings</span></a></div>`;
}
const views = {today:vToday, itinerary:vItin, bookings:vBookings, stays:vStays, budget:vBudget, tips:vTips, facts:vFacts, settings:vSettings, more:vMore};
const TAB_OF = {stays:'more', tips:'more', facts:'more', settings:'more'};
function route(){
  if (!DATA){ document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on')); $('#app').innerHTML = vLanding(); return; }
  const h = (location.hash||'#today').slice(1), v = views[h] ? h : 'today';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+(TAB_OF[v]||v)));
  const focus = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = views[v]() + `<div class="foot">${S.db?'Edits sync between your devices':'Edits are saved on this device only'}</div>`;
  if (focus==='shrange' && $('#shrange')) $('#shrange').focus();
}
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-close],[data-lclose],a,span[data-rm]'); if (!t) return;
  const ds = t.dataset;
  // modal
  if (ds.lclose !== undefined && (e.target === t || t.tagName==='BUTTON')){ L = null; renderLogin(); return; }
  if (ds.lmode){ L.mode = ds.lmode; L.err = ''; L.msg = ''; renderLogin(); return; }
  if (ds.login !== undefined){ if (SB) openLogin('in'); return; }
  if (ds.signout !== undefined){ if (SB) SB.auth.signOut(); return; }
  if (t.id === 'sync' && SB && !S.user){ openLogin('in'); return; }
  if (ds.close !== undefined && e.target === t){ cancelEdit(); return; }
  if (ds.ecancel !== undefined) return cancelEdit();
  if (ds.esave !== undefined) return saveEdit();
  if (ds.rm !== undefined && E){ e.stopPropagation(); e.preventDefault(); readForm(); const [field,n] = ds.rm.split('|'); const m = E.draft[field].splice(+n,1)[0];
    if (m){ if (E.uploaded.includes(m.id)){ dropAssets([m.id]); E.uploaded = E.uploaded.filter(x=>x!==m.id); } else E.removed.push(m.id); }
    renderModal(); return; }
  if (ds.edel !== undefined){ readForm(); if (!E.delArm){ E.delArm = true; renderModal(); return; } deleteEdit(); return; }
  if (ds.ereset !== undefined){ const i = E.i, date = DATA.days[i].date, doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{};
    const o = doc.ov[E.id] || {}; doc.ov[E.id] = {media:o.media||[], noteMedia:o.noteMedia||[], paid:o.paid, done:o.done};
    dropAssets(E.uploaded); E = null; renderModal(); route(); saveDay(date); return; }
  if (ds.preadd !== undefined){ openPre(null); return; }
  if (ds.preedit){ openPre(ds.preedit); return; }
  if (ds.fx !== undefined){ S.ui.fx[ds.fx] = (S.ui.fx[ds.fx] + 1 + Math.floor(Math.random()*(+ds.fxn-1))) % +ds.fxn; route(); return; }
  if (ds.fxplace){ S.ui.fxPlace = ds.fxplace; route(); return; }
  if (ds.themeSet){ setTheme(ds.themeSet); return; }
  if (ds.disp){ setDisp(ds.disp); return; }
  if (ds.enewcat !== undefined){ const n = ($('#e_newcat').value||'').trim(); if (!n) return; readForm();
    const id = 'c'+Date.now().toString(36); S.settings = clone(ST()); S.settings.cats.push({id, name:n}); E.draft.cat = id; E.newCat = false; saveSettings(); renderModal(); return; }
  if (ds.view !== undefined && ds.rm === undefined){ const src = ds.src, ty = ds.type;
    const lb = document.createElement('div'); lb.className='lb';
    lb.innerHTML = (ty==='video' ? `<video src="${esc(src)}" controls autoplay playsinline></video>` : `<img src="${esc(src)}" alt="">`) + `<button class="btn">Close</button>`;
    lb.addEventListener('click', ev=>{ if (ev.target===lb || ev.target.tagName==='BUTTON') lb.remove(); }); document.body.appendChild(lb); return; }
  // itinerary
  if (ds.day !== undefined){ S.ui.day = +ds.day; S.ui.shift = null; route(); return; }
  if (ds.step){ S.ui.day += +ds.step; S.ui.shift = null; route(); window.scrollTo(0,0); return; }
  if (ds.open){ S.ui.open[ds.open] = !S.ui.open[ds.open]; route(); return; }
  if (ds.edit){ const [i,id] = ds.edit.split('|'); openEdit(+i, id); return; }
  if (ds.add){ const [i,after] = ds.add.split('|'); const list = items(+i,{withShift:false});
    let time;
    if (after==='end'){ const last = list.length ? toMin(list[list.length-1].time) : 600; time = fromMin((last??600)+60); }
    else { const a = toMin(list[+after]?.time), b = toMin(list[+after+1]?.time);
      time = fromMin(a!==null && b!==null ? Math.round((a+b)/2/5)*5 : (a ?? 600)+30); }
    openEdit(+i, null, time); return; }
  if (ds.restore){ const [i,id] = ds.restore.split('|'); const it = items(+i,{withShift:false,includeRemoved:true}).find(x=>x.id===id); patchItem(+i, it, {removed:false}); return; }
  if (ds.shiftopen !== undefined){ const i = +ds.shiftopen, l = items(i,{withShift:false}); S.ui.shift = {day:i, from:l[0]?.id, mins:0}; route(); return; }
  if (ds.shiftcancel !== undefined){ S.ui.shift = null; route(); return; }
  if (ds.nudge){ S.ui.shift.mins = Math.max(-180, Math.min(180, S.ui.shift.mins + +ds.nudge)); route(); return; }
  if (ds.shiftapply !== undefined){
    const sh = S.ui.shift, i = sh.day, date = DATA.days[i].date, list = items(i);
    const doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{}; doc.custom = doc.custom||{};
    list.forEach(x=>{ if (!x.preview) return; if (x.base) doc.ov[x.id] = Object.assign(doc.ov[x.id]||{}, {time:x.preview}); else doc.custom[x.id] = Object.assign(doc.custom[x.id]||{}, {time:x.preview}); });
    S.ui.shift = null; route(); saveDay(date); return; }
  // bookings / budget
  if (ds.bf){ S.ui.bfilter = ds.bf; route(); return; }
  if (ds.goto){ S.ui.day = +ds.goto; return; }
  if (ds.catdel){ S.settings = clone(ST()); S.settings.cats = S.settings.cats.filter(c=>c.id!==ds.catdel); saveSettings(); route(); return; }
  if (ds.catadd !== undefined){ const n = ($('#newcat').value||'').trim(); if (!n) return; S.settings = clone(ST()); S.settings.cats.push({id:'c'+Date.now().toString(36), name:n}); saveSettings(); route(); return; }
});
document.addEventListener('input', e=>{
  if (/^e_(est|paid)$/.test(e.target.id) && E){ updConv(); return; }
  if (e.target.id==='shrange'){ const sh = S.ui.shift; sh.mins = +e.target.value;
    $('.shiftval').textContent = (sh.mins>0?'+':'')+sh.mins+'′';
    $('[data-shiftapply]').disabled = !sh.mins;
    $('#tlwrap').innerHTML = tlBody(sh.day); }
});
document.addEventListener('change', e=>{
  const t = e.target, ds = t.dataset;
  if (ds.done){ const [i,id] = ds.done.split('|'); const it = items(+i,{withShift:false}).find(x=>x.id===id); patchItem(+i, it, {done:t.checked}); return; }
  if (ds.bk){ S.settings = clone(ST()); if (t.checked) S.settings.bdone[ds.bk] = true; else delete S.settings.bdone[ds.bk]; saveSettings(); route(); return; }
  if (ds.catname){ const n = t.value.trim(); if (!n) { route(); return; } S.settings = clone(ST()); const c = S.settings.cats.find(c=>c.id===ds.catname); if (c && c.name!==n){ c.name = n; saveSettings(); } return; }
  if (t.id==='shfrom'){ S.ui.shift.from = t.value; route(); return; }
  if (/^rate_/.test(t.id)){ const c = t.id.slice(5), v = +t.value; if (!(v>0)) { route(); return; } S.settings = clone(ST()); S.settings.rates = Object.assign({}, rates(), S.settings.rates||{}); delete S.settings.rates.IDR; S.settings.rates[c] = v; saveSettings(); route(); return; }
  if (t.id==='disp'){ setDisp(t.value); return; }
  if (t.id==='ppl'){ S.settings = clone(ST()); S.settings.people = Math.max(1, Math.round(+t.value) || 1); saveSettings(); route(); return; }
  if (t.id==='snow'){ S.settings = clone(ST()); S.settings.snow = t.value; saveSettings(); route(); return; }
  if (t.id==='e_cat' && t.value==='__new'){ readForm(); E.newCat = true; renderModal(); setTimeout(()=>$('#e_newcat')&&$('#e_newcat').focus(),0); return; }
  if (ds.up){ upload([...t.files], ds.up); return; }
  if (/^e_(est|paid)[cb]?$/.test(t.id) && E){ updConv(); return; }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && E) cancelEdit(); });
document.addEventListener('submit', e=>{ if (e.target.id==='lform'){ e.preventDefault(); submitLogin(); } });

let THEME = (()=>{try{return localStorage.getItem('jp26:theme')||'light'}catch(e){return 'light'}})();
function setTheme(t){ THEME=t; try{localStorage.setItem('jp26:theme',t)}catch(e){} window.__applyTheme(t); route(); }
function setDisp(c){ if (!CURS.includes(c)) return; DISP = c; ls.set('disp', c); $('#disp').value = c; route(); }
$('#disp').value = DISP;
if (!DATA) DATA = ls.get('base', null);
route();
connect();
setInterval(()=>{ if ((location.hash||'#today')==='#today' && !E) route(); }, 60000);
</script>
