<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<title>Japan Trip Companion · 21 Nov – 4 Dec 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2eb;--card:#f5f2eb;--raise:#fbf9f4;--ink:#1c1b19;--ink2:#3b3833;--muted:#8a857c;--line:#ddd7cb;--line2:#ebe6dc;
  --accent:#c2412b;--accent-soft:rgba(194,65,43,.08);--green:#4e6a47;--indigo:#33456b;
  --red:var(--accent);--red-soft:var(--accent-soft);--amber:#8a6a2f;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#121211;--card:#121211;--raise:#1b1a18;--ink:#ece8e0;--ink2:#cfcac0;--muted:#8d887e;--line:#2d2b28;--line2:#211f1d;
    --accent:#e2674f;--accent-soft:rgba(226,103,79,.12);--green:#93b08a;--indigo:#a4b4d4;--amber:#c9a46a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
button{font-family:inherit;color:inherit}
::selection{background:var(--accent-soft)}

/* header */
header{max-width:680px;margin:0 auto;padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:12px;align-items:baseline}
.brand .kan{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.06em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
#hdr{display:flex;gap:10px;align-items:center;padding-top:2px}
#sync{font-size:11px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer;letter-spacing:.04em}
#disp{width:auto;font:500 12px var(--mono);padding:2px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);cursor:pointer}

/* bottom tabs */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav#nav a{flex:1;max-width:120px;text-align:center;text-decoration:none;color:var(--muted);padding:16px 0 18px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav#nav a b{font-size:16px;font-weight:500;line-height:1.2}
nav#nav a span{font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
nav#nav a.on{color:var(--ink)}
nav#nav a.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--accent)}

main{max-width:680px;margin:0 auto;padding:8px 20px 110px}
h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:36px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
h2:first-child{margin-top:14px}
h3{font-size:15px;font-weight:700;margin:0 0 2px}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.kanji{font-weight:500;letter-spacing:.05em}

/* status: words, not pills */
.badge{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:none;padding:0;white-space:nowrap}
.b-book{color:var(--accent)}
.b-fixed{color:var(--ink2)}
.b-flex{color:var(--muted)}
.b-opt{color:var(--muted);font-weight:500}
.b-custom{color:var(--indigo)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;letter-spacing:.04em}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.btn.red{color:var(--accent);border-color:var(--accent)}
.btn.red.arm{background:var(--accent);color:var(--paper)}
.lnk{background:none;border:0;color:var(--ink2);font-weight:500;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* day strip */
.strip{display:flex;gap:2px;overflow-x:auto;padding:4px 0 2px;margin:4px -20px 0;padding-left:20px;padding-right:20px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;padding:6px 8px 8px;cursor:pointer;text-align:center;min-width:46px;color:var(--muted);border-bottom:2px solid transparent}
.chip span{display:block;font-size:11px;line-height:1.3}
.chip b{display:block;font:400 20px/1.25 var(--mono)}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.chip.today b{color:var(--accent)}

/* day header */
.dayhead{border-bottom:1px solid var(--ink);padding:26px 0 18px}
.dayhead .place{display:flex;align-items:baseline;gap:14px}
.dayhead .place .kanji{font-size:40px;line-height:1.1;font-weight:500}
.dayhead .place .rom{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dayhead .route{font-size:13px;color:var(--ink2);margin-top:10px}
.dayhead .theme{font-size:16px;margin-top:2px}

/* shift panel */
.shift{background:var(--raise);border:1px solid var(--line);padding:16px;margin:14px 0}
.shift input[type=range]{width:100%;accent-color:var(--ink)}
.shiftval{font:400 22px var(--mono);color:var(--ink)}
.tools{display:flex;gap:18px;margin:14px 0 4px}

/* timetable */
.tl{margin:0}
.it{display:grid;grid-template-columns:58px 1fr;gap:0 14px;padding:14px 0;border-bottom:1px solid var(--line2);position:relative}
.it .t{font:400 15px/1.5 var(--mono);color:var(--ink);padding-top:1px}
.it .t.moved{color:var(--indigo)}
.it .t s{display:block;font-size:11px;color:var(--muted)}
.it.s-book .t{color:var(--accent)}
.it.done .body{opacity:.45}
.it.done .act{text-decoration:line-through;text-decoration-color:var(--muted)}
.it.now .t:before{content:"";position:absolute;left:-12px;top:22px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.it.shifting .t{color:var(--indigo)}
.body{background:none;border:0;padding:0}
.act{font-weight:500;font-size:15px;line-height:1.5}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.note{font-size:13px;margin-top:8px;display:none;color:var(--ink2);border-left:1px solid var(--line);padding-left:12px}
.body.open .note{display:block}
.tick{appearance:none;width:18px;height:18px;border:1px solid var(--muted);border-radius:50%;cursor:pointer;flex:0 0 auto;margin:3px 0 0;background:transparent}
.tick:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.tick:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:16px;margin-top:6px}
.cost{font:400 12px/1.6 var(--mono);white-space:nowrap;text-align:right;color:var(--ink2)}
.cost b{font-weight:500}
.cost .paid,.paid{color:var(--green)}
.orig{color:var(--muted)}
.catpill{font-size:11px;color:var(--muted)}
.add{height:0;position:relative}
.add button{position:absolute;left:22px;top:-11px;width:22px;height:22px;border:0;background:var(--paper);color:var(--line);font:300 18px/22px var(--mono);cursor:pointer;padding:0;z-index:1}
.add button:hover,.add button:focus{color:var(--accent)}
.media{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumb{width:68px;height:68px;overflow:hidden;position:relative;background:var(--line2);cursor:pointer;border:0;padding:0;flex:0 0 auto;border-radius:1px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none}
.thumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:11px;cursor:pointer;line-height:20px;text-align:center}

/* today */
.hero{border-bottom:1px solid var(--ink);padding:30px 0 24px}
.big{font-size:44px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.big.num{font:300 72px/1 var(--mono);letter-spacing:-.04em}
.next{padding:22px 0}
.next .when{font:400 32px/1.1 var(--mono);color:var(--accent)}
.next h3{font-size:19px;font-weight:500;margin:6px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.bk{display:flex;gap:14px;align-items:flex-start}
.bk.done .bt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.filters{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px}
.filters button{border:0;background:none;padding:2px 0;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.filters button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* forms */
.inputs{display:flex;gap:18px;flex-wrap:wrap}
.inputs label,.f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=time],select,textarea{font:400 15px "Zen Kaku Gothic New",sans-serif;letter-spacing:normal;text-transform:none;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
input[type=number],input[type=time]{font-family:var(--mono)}
.inputs input,.inputs select{width:150px}
textarea{min-height:70px;resize:vertical;border:1px solid var(--line);padding:8px 10px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:18px}

/* tables & budget */
table{width:100%;border-collapse:collapse;font:400 12.5px var(--mono)}
th,td{padding:9px 4px;border-bottom:1px solid var(--line2);text-align:right}
th:first-child,td:first-child{text-align:left;white-space:nowrap;font-family:"Zen Kaku Gothic New",sans-serif}
th{font:500 10.5px "Zen Kaku Gothic New",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tfoot td{font-weight:500;border-bottom:0;border-top:1px solid var(--ink)}
.over{color:var(--accent)}.under{color:var(--green)}
.tot{font:300 30px/1.2 var(--mono);letter-spacing:-.02em;margin:4px 0}
.cbar{display:grid;gap:3px;margin:6px 0 16px}
.cbar .tr{height:3px;background:var(--line2);position:relative}
.cbar .e{position:absolute;left:0;top:0;bottom:0;background:var(--muted)}
.cbar .p{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.catrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.catrow input{flex:1}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:40px;letter-spacing:.04em}
.more a{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none}
.more a .kanji{font-size:22px}
.more a span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:22px 20px 28px;border-top:2px solid var(--ink)}
.sheet h2{border:0;margin:0;padding:0;font-size:12px}
@media(min-width:640px){.ov{align-items:center}.sheet{border:1px solid var(--line);border-top:2px solid var(--ink)}}
.f{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.f .full{grid-column:1/-1}
.money{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.money input{grid-column:1/-1}
.fs{border:0;border-top:1px solid var(--line);padding:14px 0 0;margin:0;background:none}
.fs legend{font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 0 0}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{display:none}
.err{color:var(--accent);font-size:12.5px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lb img,.lb video{max-width:100%;max-height:85vh}
.lb button{margin-top:14px;color:#fff;border-color:#fff}
@media(max-width:420px){main{padding-left:16px;padding-right:16px}.big.num{font-size:60px}.dayhead .place .kanji{font-size:34px}}
.upl,.f label.upl{display:inline-flex;flex-direction:row;width:auto;text-transform:none;letter-spacing:.04em;font-size:13px;color:var(--ink);padding:7px 14px}
#e_estconv,#e_paidconv{text-transform:none;letter-spacing:normal;font-family:var(--mono);font-size:11.5px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.tot{font-size:26px}}
</style>
</head>

  if (/shopping|thrift|don quijote|shop/.test(a) && !/→/.test(it.area)) return 'shopping';
  if (/→/.test(it.area) || /train|bus|subway|jr |shinkansen/.test(a)) return 'transport';
  if (/ticket|sky|ropeway|byodoin|todai|tenryu|garden|gyoen|kiyomizu|okochi|admission|museum|cruise|park/.test(a)) return 'attractions';
  return 'other';
}

const CURS = ['IDR','JPY','MYR','SGD'];

function rates(){ const r = ST().rates || {}; return {IDR:1, JPY:+r.JPY || +ST().fx || 110, MYR:+r.MYR || 4400, SGD:+r.SGD || 13900}; }
let DISP = ls.get('disp','IDR'); if (!CURS.includes(DISP)) DISP = 'IDR';
function fmtCur(a, cur){
  if (cur==='IDR') return 'Rp' + Math.round(a).toLocaleString('id-ID');
  if (cur==='JPY') return '¥' + Math.round(a).toLocaleString('en-US');
  const s = a.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (cur==='MYR' ? 'RM' : 'S$') + s;
}
const fmtR = idr => fmtCur(idr / rates()[DISP], DISP);      // any IDR amount -> display currency
const fmtJ = n => '¥' + Math.round(n).toLocaleString('en-US');
const toIdr = m => !m || !m.amt ? 0 : m.amt * (rates()[m.cur] || 1);   // one unit as entered
const mTotal = m => toIdr(m) * (m && m.basis==='pp' ? ST().people : 1); // whole group
function showMoney(m, label, cls=''){
  if (!m || !m.amt) return '';
  const b = m.basis==='pp' ? ' pp' : ' total';
  const orig = m.cur!==DISP ? ` <span class="orig">(${fmtCur(m.amt, m.cur)})</span>` : '';
  return `<span class="${cls}">${label} ${fmtR(toIdr(m))}${b}</span>${orig}`;
}
const short = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const wk = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||''); return m ? +m[1]*60 + +m[2] : null; };
const fromMin = m => { m = Math.max(0, Math.min(23*60+59, Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };

/* ---------- effective items ---------- */
function dayDoc(date){ return S.days[date] || {ov:{}, custom:{}}; }
function items(i, {withShift=true, includeRemoved=false}={}){
  const d = DATA.days[i], doc = dayDoc(d.date);
  let list = d.items.map((b,k)=>{
    const base = { id:'b'+k, k, base:true, time:b.time, origTime:b.time, area:b.area, act:b.act, mode:b.mode, dur:b.dur, ticket:b.ticket, status:b.status, note:b.note, src:b.src,
      est: b.jpy ? {amt:b.jpy, cur:'JPY'} : (b.idr ? {amt:b.idr, cur:'IDR'} : {amt:0, cur:'JPY'}),
      paid:{amt:0, cur:'JPY'}, cat: guessCat(b), media:[], noteMedia:[], done:false, removed:false, snowOpt: /^OPTION [ABC]/.test(b.act) ? b.act[7] : null };
    return normMoney(Object.assign(base, doc.ov?.['b'+k] || {}));
  });
  Object.entries(doc.custom || {}).forEach(([id,c])=> list.push(normMoney(Object.assign({id, k:999, base:false, status:'Custom', est:{amt:0,cur:'JPY'}, paid:{amt:0,cur:'JPY'}, cat:'other', media:[], noteMedia:[]}, c))));
  if (!includeRemoved) list = list.filter(x=>!x.removed);
  list.sort((a,b)=> (toMin(a.time)??9999)-(toMin(b.time)??9999) || a.k-b.k);
  const sh = S.ui.shift;
  if (withShift && sh && sh.day===i && sh.mins){
    const from = list.findIndex(x=>x.id===sh.from);
    if (from>=0) list.forEach((x,n)=>{ if(n>=from && toMin(x.time)!==null){ x.preview = fromMin(toMin(x.time)+sh.mins); x.shifting = true; } });
  }
  return list;
}
const countsEst = it => !it.snowOpt || it.snowOpt===ST().snow;
function normMoney(it){
  it.est = Object.assign({amt:0, cur:'JPY'}, it.est); it.est.basis = it.est.basis || 'pp';
  it.paid = Object.assign({amt:0, cur:'JPY'}, it.paid); it.paid.basis = it.paid.basis || 'total';
  it.media = it.media || []; it.noteMedia = it.noteMedia || [];
  return it;
}
function preItems(){ return Object.entries(S.pre.items || {}).map(([id,x])=>normMoney(Object.assign({id, kind:'pre', name:'', cat:'other', note:''}, clone(x)))).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name)); }
function preTotals(){ const l = preItems(); return { est: l.reduce((a,x)=>a+mTotal(x.est),0), paid: l.reduce((a,x)=>a+mTotal(x.paid),0), estPaid: l.filter(x=>x.paid.amt).reduce((a,x)=>a+mTotal(x.est),0) }; }

/* ---------- persistence ---------- */
const queues = {};
function setSync(t){ $('#sync').textContent = t; }
function writeDoc(path, body){
  if (!S.db){ return Promise.resolve(); }
  queues[path] = (queues[path] || Promise.resolve()).then(async ()=>{
    setSync('Saving…');
    try { await S.db.doc(path).set(body); }
    catch(e){
      if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); await S.db.doc(path).set(body); }
      else { throw e; }
    }
    setSync('Saved');
  }).catch(e=>{
    if (e && e.code==='invalid_argument'){ S.canWrite=false; setSync('View only'); route(); }
    else if (e && e.code==='quota_exceeded'){ setSync('Storage full'); }
    else setSync('Save failed — retry');
  });
  return queues[path];
}
function saveDay(date){
  const doc = S.days[date] || {ov:{}, custom:{}};
  ls.set('days', S.days);
  return writeDoc('days/'+date, doc);
}
function savePre(){ ls.set('pre', S.pre); return writeDoc('pretrip/main', S.pre); }
function saveSettings(){ ls.set('settings', S.settings); return writeDoc('settings/main', S.settings); }
function patchItem(i, it, patch){
  const date = DATA.days[i].date;
  const doc = S.days[date] = clone(dayDoc(date));
  doc.ov = doc.ov || {}; doc.custom = doc.custom || {};
  if (it.base) doc.ov[it.id] = Object.assign(doc.ov[it.id] || {}, patch);
  else doc.custom[it.id] = Object.assign(doc.custom[it.id] || {}, patch);
  route(); return saveDay(date);
}

const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
let signQ = new Set(), signT = null;
function queueSign(id){
  if (SIGNED[id] === undefined){ SIGNED[id] = null; signQ.add(id); }
  clearTimeout(signT);
  signT = setTimeout(async ()=>{
    const ids = [...signQ]; signQ = new Set(); if (!ids.length || !SB) return;
    const { data } = await SB.storage.from('trip-media').createSignedUrls(ids.map(x=>x.slice(3)), 60*60*24);
    (data||[]).forEach((r,n)=>{ if (r && r.signedUrl) SIGNED[ids[n]] = r.signedUrl; });
    if (E) renderModal(); else route();
  }, 30);
}

async function connectClaude(){
  const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]);
  S.assets = assets;
  if (!db){ setSync('This device only'); route(); return; }
  S.db = db; S.mode = 'db';
  try { if (user){ const w = await user.can('data.write'); if (w === false) S.canWrite = false; } } catch(e){}
  subscribeAll(db);

function subscribeAll(db){
  let gotDays=false, gotSet=false;
  const timer = setTimeout(()=>{ if(!gotDays||!gotSet) setSync('Offline — may be out of date'); }, 10000);
  const done = ()=>{ if(gotDays&&gotSet){ clearTimeout(timer); setSync(S.canWrite ? 'Synced' : 'View only'); } };
  const redraw = ()=>{ if (!$('#modal').innerHTML) route(); };
  db.doc('pretrip/main').onSnapshot(snap=>{
    S.pre = snap.exists ? clone(snap.data()) : {items:{}}; S.pre.items = S.pre.items || {}; ls.set('pre', S.pre); redraw();
  }, e=>{});
  db.collection('days').onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(d=>{ if (d.exists) next[d.id] = clone(d.data()); });
    S.days = next; ls.set('days', next);
    if (!snap.metadata.fromCache){ gotDays = true; done(); } redraw();
  }, e=>{ clearTimeout(timer); setSync('Sync stopped'); });
  db.doc('settings/main').onSnapshot(snap=>{
    if (snap.exists){ const v = clone(snap.data()); if (!v.cats || !v.cats.length) v.cats = DEFAULT_CATS; v.bdone = v.bdone || {}; S.settings = v; ls.set('settings', v); }
    if (!snap.metadata.fromCache){ gotSet = true; done(); } redraw();
  }, e=>{ clearTimeout(timer); setSync('Sync stopped'); });
  route();
}

/* Supabase: a small adapter with the same shape the app already uses */
function sbAdapter(sb){
  const cache = new Map(), docL = new Map(), colL = [];
  const snapOf = p => { const has = cache.has(p); return { id: p.split('/').slice(1).join('/'), exists: has, data: () => has ? cache.get(p) : undefined, metadata:{fromCache:false, hasPendingWrites:false} }; };
  const emitDoc = p => (docL.get(p)||[]).forEach(f=>f(snapOf(p)));
  const emitCol = c => colL.filter(l=>l.c===c).forEach(l=>{ const docs = [...cache.keys()].filter(k=>k.startsWith(c+'/')).map(snapOf); l.f({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false}}); });
  const emitAll = () => { [...docL.keys()].forEach(emitDoc); [...new Set(colL.map(l=>l.c))].forEach(emitCol); };
  const toErr = e => ({ code: (e && (e.code==='42501' || /row-level security/i.test(e.message||''))) ? 'invalid_argument' : 'unavailable', message: e && e.message });
  async function load(){
    const { data, error } = await sb.from('trip_docs').select('path,data');
    if (error) throw toErr(error);
    cache.clear(); data.forEach(r=>cache.set(r.path, r.data)); emitAll();
  }
  sb.channel('trip_docs').on('postgres_changes', {event:'*', schema:'public', table:'trip_docs'}, ev=>{
    const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); if (!p) return;
    if (ev.eventType === 'DELETE') cache.delete(p); else cache.set(p, ev.new.data);
    emitDoc(p); emitCol(p.split('/')[0]);
  }).subscribe(st=>{ if (st==='SUBSCRIBED') load().catch(()=>{}); });
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') load().catch(()=>{}); });
  const db = {
    doc: path => ({
      async set(body){ cache.set(path, body); const { error } = await sb.from('trip_docs').upsert({path, data:body}); if (error) throw toErr(error); },
      async delete(){ cache.delete(path); const { error } = await sb.from('trip_docs').delete().eq('path', path); if (error) throw toErr(error); },
      onSnapshot(f){ docL.set(path, [...(docL.get(path)||[]), f]); if (cache.size) f(snapOf(path)); return ()=>{}; }
    }),
    collection: c => ({ onSnapshot(f){ colL.push({c, f}); if (cache.size) emitCol(c); return ()=>{}; } })
  };
  const assets = {
    async upload(blob){
      const ext = ((blob.type||'').split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5) || 'bin';
      const key = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from('trip-media').upload(key, blob, {contentType: blob.type || undefined, upsert:false});
      if (error) throw error;
      const id = 'sb:'+key;
      const s = await sb.storage.from('trip-media').createSignedUrl(key, 60*60*24);
      if (s.data) SIGNED[id] = s.data.signedUrl;
      return { id, url: undefined, sizeBytes: blob.size, contentType: blob.type };
    },
    async delete(id){ if (id && id.startsWith('sb:')) await sb.storage.from('trip-media').remove([id.slice(3)]); }
  };
  return { db, assets, load, cache };
}

function loadScript(src){ return new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function connectSupabase(){
  setSync('Connecting…');
  try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'); }
  catch(e){ setSync(DATA ? 'Offline — this device only' : 'Offline'); route(); return; }
  SB = supabase.createClient(SB_CONF.url, SB_CONF.key, { auth: { persistSession:true, storageKey:'jp26-auth', detectSessionInUrl:true } });
  SB.auth.onAuthStateChange((ev, session)=>{
    if (ev === 'PASSWORD_RECOVERY'){ openLogin('reset'); return; }
    if (ev === 'SIGNED_OUT'){ S.user = null; S.db = null; S.assets = null; S.mode = 'local'; setSync('Sign in to sync'); route(); }
  });
  const { data:{ session } } = await SB.auth.getSession();
  if (session) await startSupabase(session); else { setSync('Sign in to sync'); route(); }
}
async function startSupabase(session){
  S.user = session.user.email;
  const { data, error } = await SB.from('trip_members').select('email').limit(1);
  if (error){ setSync('Offline — this device only'); route(); return; }
  if (!data.length){ S.notMember = true; setSync('Not on the trip list'); route(); return; }
  S.notMember = false;
  const a = sbAdapter(SB);
  try { await a.load(); } catch(e){ setSync('Offline — this device only'); route(); return; }
  const base = a.cache.get('base/itinerary');
  if (base){ DATA = base; ls.set('base', base); }
  S.db = a.db; S.assets = a.assets; S.mode = 'db'; S.canWrite = true;
  subscribeAll(a.db);
}

/* ---------- Japan clock ---------- */
function jpNow(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date:`${g('year')}-${g('month')}-${g('day')}`, mins:(+g('hour')%24)*60 + +g('minute'), hm:`${String(+g('hour')%24).padStart(2,'0')}:${g('minute')}` };
}
const dayIndexForDate = d => DATA.days.findIndex(x=>x.date===d);
const WK_JA = ['日','月','火','水','木','金','土'];
const wkJa = d => WK_JA[new Date(d+'T00:00:00').getDay()];
function region(d){
  const n = DATA.days.findIndex(x=>x.date===d);
  if (n<=0) return ['移動','Travel'];
  if (n===DATA.days.length-1) return ['帰路','Homeward'];
  const s = (DATA.days[n].stay||'').toLowerCase();
  if (s.includes('akabane')) return ['東京','Tokyo'];
  if (s.includes('eirin')) return ['河口湖','Kawaguchiko'];
  if (s.includes('webase')) return ['京都','Kyoto'];
  if (s.includes('quintessa')) return ['札幌','Sapporo'];
  return ['旅','Japan'];
}

  }
  const d = DATA.days[idx], list = items(idx), [kj, rom] = region(d.date);

}

function dayTotals(i){

  const estPaid = list.filter(it=>it.paid.amt).reduce((a,it)=>a+mTotal(it.est),0);
  return {est, paid, estPaid};
}

  if (isNew) it = normMoney({ id:'c'+Date.now().toString(36), base:false, time: time||'12:00', area:'', act:'', mode:'', note:'', status:'Custom', est:{amt:0,cur:'JPY',basis:'pp'}, paid:{amt:0,cur:'JPY',basis:'total'}, cat:'other' });
  startE({ kind:'item', i, id:it.id, isNew, base:it.base, draft: clone({time:it.time, act:it.act, area:it.area, mode:it.mode, note:it.note, status:it.status, est:it.est, paid:it.paid, cat:catExists(it.cat)?it.cat:'other', media:it.media, noteMedia:it.noteMedia}) });
}
function openPre(id){
  const x = id ? preItems().find(p=>p.id===id) : null;
  const d = x || normMoney({name:'', cat:'accommodation', date:'', note:'', est:{amt:0,cur:'IDR',basis:'total'}, paid:{amt:0,cur:'IDR',basis:'total'}});
  startE({ kind:'pre', id: x ? x.id : 'p'+Date.now().toString(36), isNew:!x, draft: clone({name:d.name, cat:catExists(d.cat)?d.cat:'other', date:d.date||'', note:d.note||'', est:d.est, paid:d.paid, noteMedia:d.noteMedia||[], order:d.order||Date.now()}) });
}
function convText(m){ if (!m.amt) return ''; const one = fmtR(toIdr(m)); return (m.cur!==DISP ? '≈ '+one : '') + (m.basis==='pp' ? ` pp · ${fmtR(toIdr(m)*ST().people)} for ${ST().people}` : ''); }
function updConv(){ const v = id => $('#'+id).value;
  ['est','paid'].forEach(k=>{ const el = $('#e_'+k+'conv'); if (el) el.textContent = convText({amt:+v('e_'+k)||0, cur:v('e_'+k+'c'), basis:v('e_'+k+'b')}); }); }
const curOpts = c => CURS.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('');
const basisOpts = b => `<option value="pp" ${b==='pp'?'selected':''}>per pax</option><option value="total" ${b==='total'?'selected':''}>total</option>`;
function uploadUI(field, label, accept, hint){
  const d = E.draft;
  if (!S.assets) return `<div class="small muted">${S.db ? 'Uploading needs Editor access to this page.' : 'Uploads work when the page is opened from claude.ai while signed in.'}</div>${thumbs(d[field],false)}`;
  return `<label class="btn upl">${label}<input type="file" data-up="${field}" accept="${accept}" multiple></label>
    ${E.busy?`<span class="small muted"> Uploading ${E.busy}…</span>`:''}${thumbs(d[field], true, field)}<div class="small muted" style="margin-top:6px">${hint}</div>`;
}
function renderModal(){
  if (!E){ $('#modal').innerHTML=''; document.body.style.overflow=''; return; }
  document.body.style.overflow='hidden';
  const d = E.draft, pre = E.kind==='pre';
  const st = STATUSES.includes(d.status) ? STATUSES : [d.status, ...STATUSES];
  const head = pre ? (E.isNew?'Add pre-trip cost':'Edit pre-trip cost') : (E.isNew?'Add a stop':'Edit stop');
  const sub = pre ? 'Before the trip' : `${short(DATA.days[E.i].date)} · ${wk(DATA.days[E.i].date)}`;
  const conv = (m,id) => `<span class="small muted" id="${id}">${convText(m)}</span>`;
  $('#modal').innerHTML = `<div class="ov" data-close><div class="sheet" role="dialog" aria-label="${head}">
    <div class="row sp" style="margin-bottom:12px"><h2 style="margin:0">${head}</h2><span class="muted small">${sub}</span></div>
    <div class="f">
      ${pre ? `<label class="full">What<input type="text" id="e_name" value="${esc(d.name)}" placeholder="e.g. WeBase KYOTO 4 nights"></label>
        <label class="full">Paid / due date (optional)<input type="text" id="e_date" value="${esc(d.date)}" placeholder="e.g. 12 Nov 2026"></label>`
      : `<label>Time<input type="time" id="e_time" value="${esc(d.time)}"></label>
        <label>Status<select id="e_status">${st.map(s=>`<option ${s===d.status?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
        <label class="full">What<input type="text" id="e_act" value="${esc(d.act)}" placeholder="e.g. Ramen at Ichiran"></label>
        <label>Area / route<input type="text" id="e_area" value="${esc(d.area)}" placeholder="e.g. Shibuya"></label>
        <label>Transport<input type="text" id="e_mode" value="${esc(d.mode)}" placeholder="e.g. Walk / JR"></label>`}
      <fieldset class="fs full"><legend>Notes</legend>
        <textarea id="e_note" placeholder="Anything to remember…">${esc(d.note)}</textarea>
        <div style="margin-top:8px">${uploadUI('noteMedia', 'Add pictures', 'image/*', 'Tickets, booking confirmations, maps, screenshots, receipts.')}</div>
      </fieldset>
      <fieldset class="fs full"><legend>Cost</legend><div class="f">
        <label>Estimated<div class="money"><input type="number" min="0" step="any" id="e_est" value="${d.est.amt||''}" placeholder="0"><select id="e_estc">${curOpts(d.est.cur)}</select><select id="e_estb">${basisOpts(d.est.basis)}</select></div>${conv(d.est,'e_estconv')}</label>
        <label>Actually paid<div class="money"><input type="number" min="0" step="any" id="e_paid" value="${d.paid.amt||''}" placeholder="0"><select id="e_paidc">${curOpts(d.paid.cur)}</select><select id="e_paidb">${basisOpts(d.paid.basis)}</select></div>${conv(d.paid,'e_paidconv')}</label>
        <label class="full">Category<select id="e_cat">${ST().cats.map(c=>`<option value="${esc(c.id)}" ${c.id===d.cat?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__new">New category…</option></select></label>
        ${E.newCat?`<div class="full catrow" style="margin:0"><input type="text" id="e_newcat" placeholder="New category name"><button class="btn pri" data-enewcat>Add</button></div>`:''}
      </div></fieldset>
      ${pre ? '' : `<fieldset class="fs full"><legend>Trip photos &amp; videos</legend>${uploadUI('media','Add photos / videos','image/*,video/*','Up to 20 MB per file; large photos are resized automatically.')}</fieldset>`}
    </div>
    ${E.err?`<p class="err">${esc(E.err)}</p>`:''}
    <div class="row sp" style="margin-top:16px">
      <span class="row" style="gap:8px">${E.isNew?'':`<button class="btn red ${E.delArm?'arm':''}" data-edel>${E.delArm?'Tap again to confirm':(E.base?'Remove from plan':'Delete')}</button>`}
        ${E.base && !E.isNew ? `<button class="btn" data-ereset>Reset to original</button>`:''}</span>
      <span class="row" style="gap:8px"><button class="btn" data-ecancel>Cancel</button><button class="btn pri" data-esave ${E.busy?'disabled':''}>Save</button></span>
    </div></div></div>`;
}
function readForm(){
  if (!E) return;
  const v = id => $('#'+id) ? $('#'+id).value : undefined;
  const d = E.draft;
  if (E.kind==='pre'){ d.name = (v('e_name')||'').trim(); d.date = v('e_date')||''; }
  else { d.time = v('e_time') || d.time; d.status = v('e_status'); d.act = (v('e_act')||'').trim(); d.area = v('e_area'); d.mode = v('e_mode'); }
  d.note = v('e_note');
  d.est = {amt: +v('e_est') || 0, cur: v('e_estc'), basis: v('e_estb')};
  d.paid = {amt: +v('e_paid') || 0, cur: v('e_paidc'), basis: v('e_paidb')};
  const c = v('e_cat'); if (c && c!=='__new') d.cat = c;
}
async function compress(file){
  if (!file.type.startsWith('image/') || file.size < 1.5e6 || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch(e){ return file; }
}
async function upload(files, field){
  readForm(); E.err = '';
  const allowVideo = field==='media';
  for (const f of files){
    if (!(f.type.startsWith('image/') || (allowVideo && f.type.startsWith('video/')))){ E.err = `${f.name}: ${allowVideo?'only photos and videos':'only pictures'} here.`; renderModal(); continue; }
    E.busy++; renderModal();
    const mine = E;
    try {
      const blob = await compress(f);
      if (blob.size > 20*1024*1024){ mine.err = `${f.name} is ${(blob.size/1048576).toFixed(0)} MB — over the 20 MB limit. Trim or compress it first.`; }
      else {
        const r = await S.assets.upload(blob);
        mine.draft[field].push({id:r.id, url:r.url, type: f.type.startsWith('video') ? 'video':'image', name:f.name});
        mine.uploaded.push(r.id);
        if (E !== mine) { try{ S.assets.delete(r.id); }catch(_){} }
      }
    } catch(e){ mine.err = `Couldn't upload ${f.name}${e && e.message ? ': '+e.message : ''}.`; }
    mine.busy--; if (E === mine) renderModal();
  }
}
function dropAssets(ids){ ids.forEach(id=>{ try{ S.assets && S.assets.delete(id); }catch(e){} }); }
function saveEdit(){
  readForm();
  const d = E.draft;
  if (E.kind==='pre'){
    if (!d.name){ E.err = 'Give it a name.'; renderModal(); return; }
    S.pre = clone(S.pre) || {items:{}}; S.pre.items = S.pre.items || {};
    S.pre.items[E.id] = {name:d.name, cat:d.cat, date:d.date, note:d.note, est:d.est, paid:d.paid, noteMedia:d.noteMedia, order:d.order};
    dropAssets(E.removed); E = null; renderModal(); route(); savePre(); return;
  }
  if (!d.act){ E.err = 'Give the stop a name.'; renderModal(); return; }
  const date = DATA.days[E.i].date;
  const doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov || {}; doc.custom = doc.custom || {};
  const patch = {time:d.time, act:d.act, area:d.area, mode:d.mode, note:d.note, status:d.status, est:d.est, paid:d.paid, cat:d.cat, media:d.media, noteMedia:d.noteMedia};
  if (E.base) doc.ov[E.id] = Object.assign(doc.ov[E.id]||{}, patch);
  else doc.custom[E.id] = Object.assign(doc.custom[E.id]||{done:false}, patch);
  dropAssets(E.removed); E = null; renderModal(); route(); saveDay(date);
}
function cancelEdit(){ if (E) dropAssets(E.uploaded); E = null; renderModal(); }
function deleteEdit(){
  if (E.kind==='pre'){
    const x = S.pre.items?.[E.id]; S.pre = clone(S.pre); delete S.pre.items[E.id];
    dropAssets([...(x?.noteMedia||[]).map(m=>m.id), ...E.uploaded]); E = null; renderModal(); route(); savePre(); return;
  }
  const date = DATA.days[E.i].date, doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{}; doc.custom = doc.custom||{};
  if (E.base) doc.ov[E.id] = Object.assign(doc.ov[E.id]||{}, {removed:true});
  else { const c = doc.custom[E.id]; dropAssets([...(c?.media||[]), ...(c?.noteMedia||[])].map(m=>m.id)); dropAssets(E.uploaded); delete doc.custom[E.id]; }
  E = null; renderModal(); route(); saveDay(date);
}

/* ---------- router ---------- */
function vMore(){
  return `<h2>More</h2><div class="more">
    <a href="#stays"><span class="kanji">宿 · 便</span><span>Stays &amp; flights</span></a>
    <a href="#tips"><span class="kanji">心得</span><span>Tips</span></a>
    <a href="#settings"><span class="kanji">設定</span><span>Settings</span></a></div>`;
}
const views = {today:vToday, itinerary:vItin, bookings:vBookings, stays:vStays, budget:vBudget, tips:vTips, settings:vSettings, more:vMore};
const TAB_OF = {stays:'more', tips:'more', settings:'more'};
function route(){
  if (!DATA){ document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on')); $('#app').innerHTML = vLanding(); return; }
  const h = (location.hash||'#today').slice(1), v = views[h] ? h : 'today';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+(TAB_OF[v]||v)));
  const focus = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = views[v]() + `<div class="foot">${S.db?'Edits sync between your devices':'Edits are saved on this device only'}</div>`;
  if (focus==='shrange' && $('#shrange')) $('#shrange').focus();
}
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-close],[data-lclose],a,span[data-rm]'); if (!t) return;
  const ds = t.dataset;
  // modal
  if (ds.lclose !== undefined && (e.target === t || t.tagName==='BUTTON')){ L = null; renderLogin(); return; }
  if (ds.lmode){ L.mode = ds.lmode; L.err = ''; L.msg = ''; renderLogin(); return; }
  if (ds.login !== undefined){ if (SB) openLogin('in'); return; }
  if (ds.signout !== undefined){ if (SB) SB.auth.signOut(); return; }
  if (t.id === 'sync' && SB && !S.user){ openLogin('in'); return; }
  if (ds.close !== undefined && e.target === t){ cancelEdit(); return; }
  if (ds.ecancel !== undefined) return cancelEdit();
  if (ds.esave !== undefined) return saveEdit();
  if (ds.rm !== undefined && E){ e.stopPropagation(); e.preventDefault(); readForm(); const [field,n] = ds.rm.split('|'); const m = E.draft[field].splice(+n,1)[0];
    if (m){ if (E.uploaded.includes(m.id)){ dropAssets([m.id]); E.uploaded = E.uploaded.filter(x=>x!==m.id); } else E.removed.push(m.id); }
    renderModal(); return; }
  if (ds.edel !== undefined){ readForm(); if (!E.delArm){ E.delArm = true; renderModal(); return; } deleteEdit(); return; }
  if (ds.ereset !== undefined){ const i = E.i, date = DATA.days[i].date, doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{};
    const o = doc.ov[E.id] || {}; doc.ov[E.id] = {media:o.media||[], noteMedia:o.noteMedia||[], paid:o.paid, done:o.done};
    dropAssets(E.uploaded); E = null; renderModal(); route(); saveDay(date); return; }
  if (ds.preadd !== undefined){ openPre(null); return; }
  if (ds.preedit){ openPre(ds.preedit); return; }
  if (ds.disp){ setDisp(ds.disp); return; }
  if (ds.enewcat !== undefined){ const n = ($('#e_newcat').value||'').trim(); if (!n) return; readForm();
    const id = 'c'+Date.now().toString(36); S.settings = clone(ST()); S.settings.cats.push({id, name:n}); E.draft.cat = id; E.newCat = false; saveSettings(); renderModal(); return; }
  if (ds.view !== undefined && ds.rm === undefined){ const src = ds.src, ty = ds.type;
    const lb = document.createElement('div'); lb.className='lb';
    lb.innerHTML = (ty==='video' ? `<video src="${esc(src)}" controls autoplay playsinline></video>` : `<img src="${esc(src)}" alt="">`) + `<button class="btn">Close</button>`;
    lb.addEventListener('click', ev=>{ if (ev.target===lb || ev.target.tagName==='BUTTON') lb.remove(); }); document.body.appendChild(lb); return; }
  // itinerary
  if (ds.day !== undefined){ S.ui.day = +ds.day; S.ui.shift = null; route(); return; }
  if (ds.step){ S.ui.day += +ds.step; S.ui.shift = null; route(); window.scrollTo(0,0); return; }
  if (ds.open){ S.ui.open[ds.open] = !S.ui.open[ds.open]; route(); return; }
  if (ds.edit){ const [i,id] = ds.edit.split('|'); openEdit(+i, id); return; }
  if (ds.add){ const [i,after] = ds.add.split('|'); const list = items(+i,{withShift:false});
    let time;
    if (after==='end'){ const last = list.length ? toMin(list[list.length-1].time) : 600; time = fromMin((last??600)+60); }
    else { const a = toMin(list[+after]?.time), b = toMin(list[+after+1]?.time);
      time = fromMin(a!==null && b!==null ? Math.round((a+b)/2/5)*5 : (a ?? 600)+30); }
    openEdit(+i, null, time); return; }
  if (ds.restore){ const [i,id] = ds.restore.split('|'); const it = items(+i,{withShift:false,includeRemoved:true}).find(x=>x.id===id); patchItem(+i, it, {removed:false}); return; }
  if (ds.shiftopen !== undefined){ const i = +ds.shiftopen, l = items(i,{withShift:false}); S.ui.shift = {day:i, from:l[0]?.id, mins:0}; route(); return; }
  if (ds.shiftcancel !== undefined){ S.ui.shift = null; route(); return; }
  if (ds.nudge){ S.ui.shift.mins = Math.max(-180, Math.min(180, S.ui.shift.mins + +ds.nudge)); route(); return; }
  if (ds.shiftapply !== undefined){
    const sh = S.ui.shift, i = sh.day, date = DATA.days[i].date, list = items(i);
    const doc = S.days[date] = clone(dayDoc(date)); doc.ov = doc.ov||{}; doc.custom = doc.custom||{};
    list.forEach(x=>{ if (!x.preview) return; if (x.base) doc.ov[x.id] = Object.assign(doc.ov[x.id]||{}, {time:x.preview}); else doc.custom[x.id] = Object.assign(doc.custom[x.id]||{}, {time:x.preview}); });
    S.ui.shift = null; route(); saveDay(date); return; }
  // bookings / budget
  if (ds.bf){ S.ui.bfilter = ds.bf; route(); return; }
  if (ds.goto){ S.ui.day = +ds.goto; return; }
  if (ds.catdel){ S.settings = clone(ST()); S.settings.cats = S.settings.cats.filter(c=>c.id!==ds.catdel); saveSettings(); route(); return; }
  if (ds.catadd !== undefined){ const n = ($('#newcat').value||'').trim(); if (!n) return; S.settings = clone(ST()); S.settings.cats.push({id:'c'+Date.now().toString(36), name:n}); saveSettings(); route(); return; }
});
document.addEventListener('input', e=>{
  if (/^e_(est|paid)$/.test(e.target.id) && E){ updConv(); return; }
  if (e.target.id==='shrange'){ const sh = S.ui.shift; sh.mins = +e.target.value;
    $('.shiftval').textContent = (sh.mins>0?'+':'')+sh.mins+'′';
    $('[data-shiftapply]').disabled = !sh.mins;
    $('#tlwrap').innerHTML = tlBody(sh.day); }
});
document.addEventListener('change', e=>{
  const t = e.target, ds = t.dataset;
  if (ds.done){ const [i,id] = ds.done.split('|'); const it = items(+i,{withShift:false}).find(x=>x.id===id); patchItem(+i, it, {done:t.checked}); return; }
  if (ds.bk){ S.settings = clone(ST()); if (t.checked) S.settings.bdone[ds.bk] = true; else delete S.settings.bdone[ds.bk]; saveSettings(); route(); return; }
  if (ds.catname){ const n = t.value.trim(); if (!n) { route(); return; } S.settings = clone(ST()); const c = S.settings.cats.find(c=>c.id===ds.catname); if (c && c.name!==n){ c.name = n; saveSettings(); } return; }
  if (t.id==='shfrom'){ S.ui.shift.from = t.value; route(); return; }
  if (/^rate_/.test(t.id)){ const c = t.id.slice(5), v = +t.value; if (!(v>0)) { route(); return; } S.settings = clone(ST()); S.settings.rates = Object.assign({}, rates(), S.settings.rates||{}); delete S.settings.rates.IDR; S.settings.rates[c] = v; saveSettings(); route(); return; }
  if (t.id==='disp'){ setDisp(t.value); return; }
  if (t.id==='ppl'){ S.settings = clone(ST()); S.settings.people = Math.max(1, Math.round(+t.value) || 1); saveSettings(); route(); return; }
  if (t.id==='snow'){ S.settings = clone(ST()); S.settings.snow = t.value; saveSettings(); route(); return; }
  if (t.id==='e_cat' && t.value==='__new'){ readForm(); E.newCat = true; renderModal(); setTimeout(()=>$('#e_newcat')&&$('#e_newcat').focus(),0); return; }
  if (ds.up){ upload([...t.files], ds.up); return; }
  if (/^e_(est|paid)[cb]?$/.test(t.id) && E){ updConv(); return; }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && E) cancelEdit(); });
document.addEventListener('submit', e=>{ if (e.target.id==='lform'){ e.preventDefault(); submitLogin(); } });

function setDisp(c){ if (!CURS.includes(c)) return; DISP = c; ls.set('disp', c); $('#disp').value = c; route(); }
$('#disp').value = DISP;
if (!DATA) DATA = ls.get('base', null);
route();
connect();
setInterval(()=>{ if ((location.hash||'#today')==='#today' && !E) route(); }, 60000);
</script>
