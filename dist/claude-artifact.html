<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f5f2eb">

<script>
(function(){var t='light';try{t=localStorage.getItem('jp26:theme')||'light'}catch(e){}
window.__applyTheme=function(t){var d=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');
var m=document.getElementById('themeColor');if(m)m.setAttribute('content',d?'#121211':'#f5f2eb')};
window.__applyTheme(t);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){var x='light';try{x=localStorage.getItem('jp26:theme')||'light'}catch(e){}if(x==='auto')window.__applyTheme('auto')})}catch(e){}})();
</script>
<title>Japan Trip Companion · 21 Nov – 4 Dec 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2eb;--card:#f5f2eb;--raise:#fbf9f4;--ink:#1c1b19;--ink2:#3b3833;--muted:#8a857c;--line:#ddd7cb;--line2:#ebe6dc;
  --accent:#c2412b;--accent-soft:rgba(194,65,43,.08);--green:#4e6a47;--indigo:#33456b;
  --red:var(--accent);--red-soft:var(--accent-soft);--amber:#8a6a2f;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark;--paper:#121211;--card:#121211;--raise:#1b1a18;--ink:#ece8e0;--ink2:#cfcac0;--muted:#8d887e;--line:#2d2b28;--line2:#211f1d;
  --accent:#e2674f;--accent-soft:rgba(226,103,79,.12);--green:#93b08a;--indigo:#a4b4d4;--amber:#c9a46a}
select option,select optgroup{background:var(--raise);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
button{font-family:inherit;color:inherit}
::selection{background:var(--accent-soft)}

/* header */
header{max-width:680px;margin:0 auto;padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:12px;align-items:baseline}
.brand .kan{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.06em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
#hdr{display:flex;gap:10px;align-items:center;padding-top:2px}
#sync{font-size:11px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer;letter-spacing:.04em}
#disp{width:auto;font:500 12px var(--mono);padding:2px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);cursor:pointer}

/* bottom tabs */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav#nav a{flex:1;max-width:120px;text-align:center;text-decoration:none;color:var(--muted);padding:16px 0 18px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav#nav a b{font-size:16px;font-weight:500;line-height:1.2}
nav#nav a span{font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
nav#nav a.on{color:var(--ink)}
nav#nav a.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--accent)}

main{max-width:680px;margin:0 auto;padding:8px 20px 110px}
h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:36px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
h2:first-child{margin-top:14px}
h3{font-size:15px;font-weight:700;margin:0 0 2px}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.kanji{font-weight:500;letter-spacing:.05em}

/* status: words, not pills */
.badge{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:none;padding:0;white-space:nowrap}
.b-book{color:var(--accent)}
.b-fixed{color:var(--ink2)}
.b-flex{color:var(--muted)}
.b-opt{color:var(--muted);font-weight:500}
.b-custom{color:var(--indigo)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;letter-spacing:.04em}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.btn.red{color:var(--accent);border-color:var(--accent)}
.btn.red.arm{background:var(--accent);color:var(--paper)}
.lnk{background:none;border:0;color:var(--ink2);font-weight:500;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* day strip */
.strip{display:flex;gap:2px;overflow-x:auto;padding:4px 0 2px;margin:4px -20px 0;padding-left:20px;padding-right:20px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;padding:6px 8px 8px;cursor:pointer;text-align:center;min-width:46px;color:var(--muted);border-bottom:2px solid transparent}
.chip span{display:block;font-size:11px;line-height:1.3}
.chip b{display:block;font:400 20px/1.25 var(--mono)}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.chip.today b{color:var(--accent)}

/* day header */
.dayhead{border-bottom:1px solid var(--ink);padding:26px 0 18px}
.dayhead .place{display:flex;align-items:baseline;gap:14px}
.dayhead .place .kanji{font-size:40px;line-height:1.1;font-weight:500}
.dayhead .place .rom{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dayhead .route{font-size:13px;color:var(--ink2);margin-top:10px}
.dayhead .theme{font-size:16px;margin-top:2px}

/* shift panel */
.shift{background:var(--raise);border:1px solid var(--line);padding:16px;margin:14px 0}
.shift input[type=range]{width:100%;accent-color:var(--ink)}
.shiftval{font:400 22px var(--mono);color:var(--ink)}
.tools{display:flex;gap:18px;margin:14px 0 4px}

/* timetable */
.tl{margin:0}
.it{display:grid;grid-template-columns:58px 1fr;gap:0 14px;padding:14px 0;border-bottom:1px solid var(--line2);position:relative}
.it .t{font:400 15px/1.5 var(--mono);color:var(--ink);padding-top:1px}
.it .t.moved{color:var(--indigo)}
.it .t s{display:block;font-size:11px;color:var(--muted)}
.it.s-book .t{color:var(--accent)}
.it.done .body{opacity:.45}
.it.done .act{text-decoration:line-through;text-decoration-color:var(--muted)}
.it.now .t:before{content:"";position:absolute;left:-12px;top:22px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.it.shifting .t{color:var(--indigo)}
.body{background:none;border:0;padding:0}
.act{font-weight:500;font-size:15px;line-height:1.5}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.note{font-size:13px;margin-top:8px;display:none;color:var(--ink2);border-left:1px solid var(--line);padding-left:12px}
.body.open .note{display:block}
.tick{appearance:none;width:18px;height:18px;border:1px solid var(--muted);border-radius:50%;cursor:pointer;flex:0 0 auto;margin:3px 0 0;background:transparent}
.tick:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.tick:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:16px;margin-top:6px}
.cost{font:400 12px/1.6 var(--mono);white-space:nowrap;text-align:right;color:var(--ink2)}
.cost b{font-weight:500}
.cost .paid,.paid{color:var(--green)}
.orig{color:var(--muted)}
.catpill{font-size:11px;color:var(--muted)}
.add{height:0;position:relative}
.add button{position:absolute;left:22px;top:-11px;width:22px;height:22px;border:0;background:var(--paper);color:var(--line);font:300 18px/22px var(--mono);cursor:pointer;padding:0;z-index:1}
.add button:hover,.add button:focus{color:var(--accent)}
.media{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumb{width:68px;height:68px;overflow:hidden;position:relative;background:var(--line2);cursor:pointer;border:0;padding:0;flex:0 0 auto;border-radius:1px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none}
.thumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:11px;cursor:pointer;line-height:20px;text-align:center}

/* today */
.hero{border-bottom:1px solid var(--ink);padding:30px 0 24px}
.big{font-size:44px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.big.num{font:300 72px/1 var(--mono);letter-spacing:-.04em}
.next{padding:22px 0}
.next .when{font:400 32px/1.1 var(--mono);color:var(--accent)}
.next h3{font-size:19px;font-weight:500;margin:6px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.bk{display:flex;gap:14px;align-items:flex-start}
.bk.done .bt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.filters{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px}
.filters button{border:0;background:none;padding:2px 0;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.filters button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* forms */
.inputs{display:flex;gap:18px;flex-wrap:wrap}
.inputs label,.f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=time],select,textarea{font:400 15px "Zen Kaku Gothic New",sans-serif;letter-spacing:normal;text-transform:none;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
input[type=number],input[type=time]{font-family:var(--mono)}
.inputs input,.inputs select{width:150px}
textarea{min-height:70px;resize:vertical;border:1px solid var(--line);padding:8px 10px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:18px}

/* tables & budget */
table{width:100%;border-collapse:collapse;font:400 12.5px var(--mono)}
th,td{padding:9px 4px;border-bottom:1px solid var(--line2);text-align:right}
th:first-child,td:first-child{text-align:left;white-space:nowrap;font-family:"Zen Kaku Gothic New",sans-serif}
th{font:500 10.5px "Zen Kaku Gothic New",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tfoot td{font-weight:500;border-bottom:0;border-top:1px solid var(--ink)}
.over{color:var(--accent)}.under{color:var(--green)}
.tot{font:300 30px/1.2 var(--mono);letter-spacing:-.02em;margin:4px 0}
.cbar{display:grid;gap:3px;margin:6px 0 16px}
.cbar .tr{height:3px;background:var(--line2);position:relative}
.cbar .e{position:absolute;left:0;top:0;bottom:0;background:var(--muted)}
.cbar .p{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.catrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.catrow input{flex:1}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:40px;letter-spacing:.04em}
.more a{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none}
.more a .kanji{font-size:22px}
.more a span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,19,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:22px 20px 28px;border-top:2px solid var(--ink)}
.sheet h2{border:0;margin:0;padding:0;font-size:12px}
@media(min-width:640px){.ov{align-items:center}.sheet{border:1px solid var(--line);border-top:2px solid var(--ink)}}
.f{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.f .full{grid-column:1/-1}
.money{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.money input{grid-column:1/-1}
.fs{border:0;border-top:1px solid var(--line);padding:14px 0 0;margin:0;background:none}
.fs legend{font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 0 0}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{display:none}
.err{color:var(--accent);font-size:12.5px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lb img,.lb video{max-width:100%;max-height:85vh}
.lb button{margin-top:14px;color:#fff;border-color:#fff}
@media(max-width:420px){main{padding-left:16px;padding-right:16px}.big.num{font-size:60px}.dayhead .place .kanji{font-size:34px}}
.upl,.f label.upl{display:inline-flex;flex-direction:row;width:auto;text-transform:none;letter-spacing:.04em;font-size:13px;color:var(--ink);padding:7px 14px}
#e_estconv,#e_paidconv{text-transform:none;letter-spacing:normal;font-family:var(--mono);font-size:11.5px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.tot{font-size:26px}}
.fxlist{margin:0;padding-left:22px}.fxlist li{margin:0 0 10px;font-size:14px;line-height:1.6}.fxlist li::marker{color:var(--muted);font:12px var(--mono)}
.card.fx{border-left:2px solid var(--accent);padding-left:14px}

/* day moods */
html,body{transition:background-color .7s ease}
header,main,.foot{position:relative;z-index:1}
.vfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.vfx i{position:absolute;display:block;left:calc(var(--x)*1%);top:0;will-change:transform}
.k-snow i{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.5;animation:vfall var(--d) linear var(--t) infinite}
.k-petal i{width:var(--s);height:calc(var(--s)*.7);border-radius:80% 0 80% 0;background:var(--c);opacity:.55;animation:vfall var(--d) linear var(--t) infinite}
.k-leaf i{width:var(--s);height:var(--s);border-radius:0 100% 0 100%;background:var(--c);opacity:.5;animation:vfall var(--d) linear var(--t) infinite}
.k-bamboo i{width:calc(var(--s)*.35);height:calc(var(--s)*1.7);border-radius:100% 0;background:var(--c);opacity:.5;animation:vfall var(--d) linear var(--t) infinite}
.k-glow i,.k-mote i{top:auto;bottom:-70px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:0;animation:vrise var(--d) ease-in var(--t) infinite}
.k-mote i{background:var(--c);filter:blur(1px)}
.k-twinkle i{top:calc(var(--y)*1%);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);opacity:.1;animation:vtw var(--d) ease-in-out var(--t) infinite}
.k-mist i,.k-cloud i{top:calc(var(--y)*1%);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.4;animation:vdrift var(--d) ease-in-out var(--t) infinite alternate}
.k-cloud i{height:calc(var(--s)*.22)}
.k-streak i{left:-240px;top:calc(var(--y)*1%);width:var(--s);height:1.5px;background:linear-gradient(90deg,transparent,var(--c));opacity:.6;animation:vstreak var(--d) linear var(--t) infinite}
.k-ripple i{top:calc(var(--y)*1%);width:10px;height:10px;border:1.5px solid var(--c);border-radius:50%;opacity:0;animation:vrip var(--d) ease-out var(--t) infinite}
@keyframes vfall{from{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(calc(var(--dx)*.4),50vh,0) rotate(calc(var(--r)*.6))}to{transform:translate3d(var(--dx),108vh,0) rotate(var(--r))}}
@keyframes vrise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.55}85%{opacity:.4}100%{transform:translate3d(var(--dx),-112vh,0);opacity:0}}
@keyframes vtw{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.85;transform:scale(1.25)}}
@keyframes vdrift{from{transform:translateX(-14vw)}to{transform:translateX(20vw)}}
@keyframes vstreak{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 480px))}}
@keyframes vrip{0%{transform:scale(.3);opacity:.6}100%{transform:scale(var(--sc));opacity:0}}
.dayhead{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 11%,transparent),transparent 78%);padding-left:12px;padding-right:12px;margin:0 -12px;transition:background .7s}
.dayhead .mood{display:inline-block;margin-left:10px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.vfx{display:none}html,body{transition:none}}
.wx{font-size:12.5px;margin-top:8px;color:var(--ink2)}.wx b{font-weight:500}
.phr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:13px 0;cursor:pointer}
.phr .en{display:block;font-size:14px}.phr .ja{display:block;font-size:17px;margin-top:2px;color:var(--ink2)}.phr .ro{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.phr.on{background:var(--raise);border:1px solid var(--ink);padding:18px 14px;margin:8px 0}.phr.on .ja{font-size:34px;line-height:1.35;font-weight:500;color:var(--ink);margin:10px 0 8px}
.pace{border-left:4px solid var(--green)}
.pace .pc-clock{font-family:var(--mono);font-size:18px}
.pace .pc-state{margin-top:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--green)}
.pace .pc-big{font-family:var(--mono);font-size:52px;line-height:1.05;margin:2px 0 4px;color:var(--green)}
.pace .pc-bar{height:6px;background:var(--line2);border-radius:3px;margin-top:10px;overflow:hidden}
.pace .pc-bar i{display:block;height:100%;background:var(--green)}
.pace .pc-hard{margin-top:10px;padding-top:8px;border-top:1px solid var(--line2);font-size:13px}
.pace.pc-wrap{border-left-color:var(--amber)} .pc-wrap .pc-state,.pc-wrap .pc-big{color:var(--amber)} .pc-wrap .pc-bar i{background:var(--amber)}
.pace.pc-go{border-left-color:var(--accent);background:var(--accent-soft)} .pc-go .pc-state,.pc-go .pc-big{color:var(--accent)} .pc-go .pc-bar i{background:var(--accent)}
.pc-go .pc-big{animation:pcpulse 1s ease-in-out infinite} @keyframes pcpulse{50%{opacity:.55}}
</style>
</head>
<body>
<div class="vfx" id="vfx" aria-hidden="true"></div>
<header>
  <div class="brand"><span class="kan">旅</span><div><h1>JAPAN 2026</h1><p>21.11 — 04.12 · 東京 河口湖 京都 札幌</p></div></div>
  <div id="hdr"><button id="sync" type="button">Loading…</button><select id="disp" aria-label="Show amounts in"><option>IDR</option><option>JPY</option><option>MYR</option><option>SGD</option></select></div>
</header>
<nav id="nav">
  <a href="#today"><span>Today</span></a><a href="#itinerary"><span>Plan</span></a><a href="#budget"><span>Budget</span></a><a href="#bookings"><span>Bookings</span></a><a href="#more"><span>More</span></a>
</nav>
<main id="app"></main>
<div id="modal"></div>

green onions.", "Nishijin in Kyoto has been famous for silk weaving for over 500 years.", "The Kyoto International Manga Museum is in a former elementary school and holds about 300,000 items.", "Japan's first electric streetcar ran in Kyoto in 1895.", "Kyoto is the setting of the novel and film Memoirs of a Geisha.", "Kyoto's Kamo River is so clean that you can sometimes see herons and ducks fishing in the middle of the city.", "Arashiyama's Sagano Romantic Train is an old-style sightseeing train along the Hozugawa gorge.", "Kyoto's machiya often have narrow inner gardens called tsuboniwa to let in light and air.", "Matcha sweets are everywhere in Kyoto because Uji, Japan's most famous tea town, is right next door."], "nara": ["Nara, then called Heijo-kyo, was Japan's capital from 710 to 784.", "Japan's oldest surviving histories, the Kojiki (712) and Nihon Shoki (720), were written during the Nara period.", "The Man'yoshu, Japan's oldest poetry collection, comes from the Nara period. The current era name \"Reiwa\" was taken from it.", "Nara's UNESCO listing, \"Historic Monuments of Ancient Nara\", covers eight sites.", "About 1,300 wild sika deer roam Nara Park.", "According to legend, the god of Kasuga Taisha arrived in Nara riding a white deer, so deer are seen as sacred messengers.", "Nara's deer are a protected Natural Monument. Historically, killing one could be punished by death.", "Nara's deer are wild. Nobody owns them, but they're used to people.", "Many Nara deer have learned to bow for shika senbei, special deer crackers.", "Shika senbei are made from wheat flour and rice bran, with no sugar, so they're safe for deer.", "A deer's \"bow\" can also be a warning before a headbutt. Show empty hands when you've run out of crackers.", "Autumn is rutting season, so male deer can be more pushy in October and November.", "Every October, the male deer's antlers are cut off in a ceremony that has been held since the 1600s.", "Plastic bags are dangerous for Nara's deer because they sometimes eat them. Keep your rubbish in your bag.", "Nara's deer are often seen waiting at pedestrian crossings.", "Nara Park covers about 660 hectares, including the temple and shrine grounds.", "Todai-ji means \"Great Eastern Temple\".", "Todai-ji's Great Buddha is about 15 m tall and one of the largest bronze Buddhas in the world.", "Making the Great Buddha in the 8th century used up a huge share of Japan's copper.", "The Great Buddha was opened in 752 when an Indian monk painted in its eyes, holding a brush tied to long cords that the crowd also held.", "The Great Buddha has been damaged by fire and earthquakes. Its current head dates from the 1690s.", "Todai-ji's Great Buddha Hall is one of the largest wooden buildings in the world, even though today's 1709 hall is about a third smaller than the original.", "A pillar in the Great Buddha Hall has a hole the same size as the Buddha's nostril. Crawling through it is said to bring enlightenment.", "The two 8 m wooden guardians in Todai-ji's Nandaimon gate were carved by Unkei and Kaikei's team in about 70 days in 1203.", "Todai-ji's Omizutori fire ritual in March has been held every year since 752 without a break.", "Todai-ji's Nigatsu-do hall has a free wooden veranda with a wide view over Nara.", "The monk Gyoki raised money from ordinary people to build the Great Buddha. His statue stands outside Kintetsu Nara Station.", "Shosoin, Todai-ji's treasure house, holds 8th-century objects, including glass and instruments that came along the Silk Road.", "Some Shosoin treasures go on show at the Nara National Museum each autumn.", "Kasuga Taisha was founded in 768 by the powerful Fujiwara clan.", "Kasuga Taisha has about 3,000 lanterns, and they're all lit only twice a year, in February and August.", "The Kasugayama Primeval Forest behind the shrine has been protected from logging since 841.", "Kofuku-ji was the Fujiwara family temple.", "Kofuku-ji's five-storey pagoda, about 50 m tall, is Japan's second-tallest wooden pagoda. It is under major repair until the early 2030s.", "Kofuku-ji's Ashura statue, from 734, has three faces and six arms and is one of Japan's best-loved Buddhist statues.", "Horyu-ji, near Nara, has the world's oldest surviving wooden buildings, from around the 7th century.", "Some roof tiles at Gango-ji in Nara date from the late 6th century and are among the oldest still in use in Japan.", "Naramachi, Nara's old merchant quarter, has red cloth monkey charms (migawari-zaru) hanging under the eaves to keep bad luck away.", "Wakakusayama, the grassy hill in Nara Park, is set on fire every January in the Yamayaki festival.", "Isuien garden uses \"borrowed scenery\": Todai-ji's gate and the hills behind it look like part of the garden.", "The reconstructed Suzaku Gate and Great Hall at the Heijo Palace site show how big Nara's old palace was.", "Nakatanidou, a mochi shop in Nara, is famous for super-fast mochi pounding.", "Nara's mascot Sento-kun, a boy Buddha with deer antlers, was controversial at first but became popular.", "Kakinoha-zushi, sushi wrapped in persimmon leaves, is a Nara speciality.", "Nara is one of Japan's top persimmon producers.", "Narazuke are vegetables pickled in sake lees, a Nara speciality.", "Miwa somen, thin wheat noodles from Sakurai in Nara, are said to be the origin of somen in Japan.", "Shoryaku-ji in Nara is said to be where important sake brewing methods were developed in the Middle Ages.", "Nara makes about 90% of Japan's solid ink sticks (sumi) for calligraphy.", "Yamatokoriyama in Nara is Japan's goldfish capital and hosts a national goldfish-scooping championship.", "Yoshino in Nara has about 30,000 cherry trees on its mountain slopes.", "Yoshino kudzu starch is used in fine Japanese sweets.", "The Nara Hotel, opened in 1909, has hosted guests including Albert Einstein and Audrey Hepburn.", "Asuka, south of Nara, has Ishibutai, a huge stone tomb from the 7th century with its earth mound gone.", "The tomb of Emperor Jimmu, Japan's legendary first emperor, is in Kashihara, Nara.", "Nara is about 45 minutes from Kyoto by Kintetsu train.", "Park rangers sometimes call the deer by blowing a horn in events called \"shika-yose\", and herds come running.", "Nara's deer are counted every year, and their numbers have grown in recent years.", "Deer-crossing road signs are everywhere in Nara Park.", "Some Nara deer like to nap right in the middle of temple paths."], "otaru": ["Otaru's name comes from an Ainu word for a river flowing through sandy ground.", "Otaru Canal was completed in 1923 and is about 1.1 km long.", "Otaru Canal was made by filling in land along the shore rather than by digging, which is why it curves gently.", "In the 1980s, half of Otaru Canal was filled in for a road. Local residents campaigned to save the rest.", "Otaru Canal has about 63 gas lamps, which are lit at dusk.", "The old stone warehouses along the canal are now restaurants, shops and a beer hall.", "Otaru was once Hokkaido's financial centre and was nicknamed \"the Wall Street of the North\".", "Otaru grew rich as a port for herring fishing and coal shipping.", "Herring barons built huge \"herring mansions\" (nishin goten) along the coast near Otaru.", "The former Bank of Japan Otaru branch (1912) was designed by Tatsuno Kingo, the architect of Tokyo Station. It's now a free museum.", "Otaru's glass industry started in the Meiji period by making oil lamps and glass fishing floats.", "Kitaichi Glass began in 1901 making oil lamps and fishing floats.", "Kitaichi Hall is lit only by 167 oil lamps.", "Sakaimachi Street is Otaru's main shopping street for glass, music boxes and sweets.", "The Otaru Music Box Museum's main hall, from 1912, is packed with tens of thousands of music boxes.", "The steam clock outside the Otaru Music Box Museum was made by Raymond Saunders, the Vancouver clockmaker behind Gastown's famous steam clock, and it whistles every 15 minutes.", "LeTAO's \"Double Fromage\" cheesecake is Otaru's most famous sweet.", "Otaru is known for its sushi, and has a street lined with sushi restaurants.", "Naruto in Otaru serves \"half chicken\", half a chicken deep-fried whole.", "Ankake yakisoba, fried noodles topped with thick gravy, is Otaru's local comfort food.", "Panju, small pancake sweets filled with red bean, are a classic Otaru snack.", "Otaru Beer is brewed using German methods under the strict Reinheitsgebot purity law.", "Hokkaido's first railway, opened in 1880, ran between Otaru and Sapporo. Part of the old Temiya Line is now a walking path.", "On the train from Sapporo to Otaru, sit on the right side for views of the sea.", "Otaru is about 30–45 minutes from Sapporo by JR train.", "Otaru is a key setting for Shunji Iwai's 1995 film \"Love Letter\", which is very popular in Asia.", "The Otaru Snow Light Path festival in February fills the canal and streets with candles in snow lanterns.", "The Mt Tengu ropeway has views over Otaru and the bay, and there's a hall full of long-nosed tengu masks at the top.", "The Nikka Whisky Yoichi Distillery, founded by Masataka Taketsuru, is about 25 minutes from Otaru.", "Taketsuru and his Scottish wife Rita inspired the popular TV drama \"Massan\".", "Shakotan, near Otaru, is famous for sea urchin (uni) in summer.", "Otaru's population peaked at around 200,000 in the 1960s. Today it's about 110,000.", "Otaru Suitengu Shrine sits on a hill with views over the port.", "Otaru has many Western-style stone buildings from its banking boom.", "Many of Otaru's old warehouses were built of stone partly to protect goods from fire.", "Hand-blown glass workshops in Otaru let visitors try glassblowing or make glass beads.", "Otaru's music box shops will let you choose the tune for a custom music box.", "The Kitaichi Venetian Art Museum has a full-size gondola and Venetian glass.", "Otaru's canal is especially pretty at dusk, when the gas lamps come on and the warehouses are lit up."], "sapporo": ["Sapporo was laid out as a planned city from 1869, which is why its streets form a neat grid.", "Sapporo's name comes from Ainu words often explained as \"dry, great river\".", "Sapporo addresses work like coordinates, such as \"North 3, West 4\", counted from Odori Park and the Sosei River.", "Sapporo is Japan's fifth-largest city, with about 2 million people.", "Sapporo gets around 5 m of snow a year, a huge amount for a city of its size.", "Sapporo hosted the 1972 Winter Olympics, the first Winter Games held in Asia.", "The Okurayama ski jump, used at the 1972 Olympics, has a viewing deck at the top where you can see the drop.", "Sapporo Snow Festival began in 1950, when local high school students built six snow statues in Odori Park.", "Japan's Self-Defense Forces help build the giant snow sculptures for the Snow Festival.", "Odori Park is a long green strip about 1.5 km long that divides Sapporo into north and south.", "The Sapporo White Illumination, which lights up Odori Park from late November, was Japan's first big winter light-up event (1981).", "The Munich Christmas Market fills Odori Park from late November. Munich is Sapporo's sister city.", "Sapporo TV Tower, at the east end of Odori Park, is 147 m tall and has a giant digital clock.", "Sapporo TV Tower's mascot is \"Terebi-tou-san\", a tower with a face (the name means Mr TV Father).", "The Sapporo Clock Tower (1878) is one of Japan's oldest clock towers. It's often jokingly called one of Japan's most disappointing sights because it's so small.", "The Clock Tower's clock was made by E. Howard & Co. of Boston and still chimes on the hour.", "The Clock Tower was originally the drill hall of Sapporo Agricultural College.", "American educator William S. Clark helped found Sapporo Agricultural College (now Hokkaido University) in 1876.", "Clark's parting words to his students, \"Boys, be ambitious!\", are still famous in Japan.", "The statue of Clark at Hitsujigaoka Observation Hill points into the distance.", "Sapporo Beer, founded in 1876, is Japan's oldest beer brand.", "The red star on Sapporo Beer is the North Star symbol of the old Hokkaido Development Commission.", "The Sapporo Beer Museum is in a red-brick building that was once a sugar factory.", "Sapporo Classic beer is sold only in Hokkaido.", "Jingisukan (Genghis Khan) is Sapporo's signature dish: lamb grilled on a dome-shaped skillet said to look like a warrior's helmet.", "Lamb became popular in Hokkaido because sheep were raised there in the early 1900s for wool.", "Sapporo is the birthplace of miso ramen, created in the 1950s–60s.", "Sapporo-style ramen often has a layer of melted lard on top to keep the soup hot in freezing weather.", "Sapporo ramen usually uses thick, curly, chewy noodles.", "Ganso Ramen Yokocho in Susukino is a narrow alley packed with about 17 tiny ramen shops.", "Soup curry, a spicy, runny curry with big chunks of vegetables, was born in Sapporo in the 1970s.", "\"Shime parfait\" is a Sapporo habit: ending a night out with an ice-cream parfait instead of ramen.", "Zangi, Hokkaido-style fried chicken, is marinated more strongly than regular karaage.", "Susukino, where you're staying, is the biggest nightlife district north of Tokyo, with thousands of bars and restaurants.", "The Nikka Whisky billboard with the bearded \"King of Blenders\" is one of Susukino's best-known landmarks.", "Tanukikoji is a covered shopping arcade about 900 m long, with roots going back to 1873.", "Tanukikoji means \"raccoon dog alley\". One story says it was named after the women there who \"bewitched\" men like shape-shifting tanuki.", "Nijo Market, near Susukino, is the place for seafood rice bowls (kaisendon) piled with crab, salmon roe and sea urchin.", "Hokkaido is famous for three big crabs: hairy crab (kegani), king crab and snow crab.", "Chi-Ka-Ho, an underground walkway, connects Sapporo Station to Odori, and with Pole Town you can walk about 2 km to Susukino without going outside.", "Sapporo's subway trains run on rubber tyres, which makes them quieter.", "Sapporo's streetcar line became a loop in 2015.", "In winter, Sapporo's \"sasara densha\" trams use giant bamboo brushes to sweep snow off the tracks, a method used since the 1920s.", "Sapporo spends around 20 billion yen a year clearing snow.", "Some Sapporo pavements and roads are heated to stop snow and ice building up.", "Sapporo puts boxes of free grit at crossings in winter so you can scatter it where it's slippery.", "Locals walk on ice in short, flat-footed \"penguin steps\". Shops sell clip-on shoe spikes.", "In early December, the sun sets in Sapporo at around 4 pm.", "Average December temperatures in Sapporo are around freezing, and it's often colder at night.", "Mt Moiwa's night view over Sapporo was chosen as one of Japan's \"New Three Major Night Views\".", "The JR Tower observation deck at Sapporo Station is 160 m up, on the 38th floor.", "Shiroi Koibito, white-chocolate cookies, are made in Sapporo, and the factory has a fun theme park.", "Royce', famous for silky nama chocolate, is a Hokkaido company.", "Snow Brand (Yukijirushi) Milk started in Sapporo.", "Hokkaido produces about half of Japan's milk.", "Hokkaido grows most of Japan's potatoes.", "A pair of Yubari melons from Hokkaido once sold at auction for 5 million yen.", "Hokkaido's Seicomart convenience stores often top customer satisfaction rankings and cook fresh food in-store.", "Yakisoba Bento instant noodles are sold almost only in Hokkaido. You use the water you drain off to make a soup.", "Crypton Future Media, the company behind Hatsune Miku, is based in Sapporo, and \"Snow Miku\" is the Snow Festival's mascot.", "Hokkaido was called Ezo until 1869, when it was renamed and became part of Japan's government system.", "The Ainu are the indigenous people of Hokkaido. Japan formally recognised them as indigenous by law in 2019.", "Many Hokkaido place names, including Sapporo and Otaru, come from Ainu words.", "Hokkaido is Japan's largest prefecture, with about a fifth of the country's land but only about 4% of its people.", "Hokkaido has no proper rainy season, unlike most of Japan.", "The Seikan Tunnel under the sea links Hokkaido to Honshu and is about 54 km long.", "Hokkaido brown bears are much bigger than the black bears on Japan's main island, and sightings near Sapporo's suburbs hit record levels in 2025.", "Wild Ezo red foxes live in Hokkaido. They're cute, but don't touch or feed them because they can carry parasites.", "The shima-enaga, a tiny round white bird nicknamed the \"snow fairy\", is one of Hokkaido's most popular animals.", "Hokkaido Shrine, in Maruyama Park, enshrines the gods of Hokkaido's settlement and Emperor Meiji.", "Moerenuma Park, designed by artist Isamu Noguchi, was built on top of a former rubbish landfill.", "Sapporo Dome can slide a whole grass football pitch in and out of the stadium.", "The Hokkaido Nippon-Ham Fighters baseball team moved to Es Con Field in 2023, which has a hot spring and sauna overlooking the field.", "Jozankei Onsen, about an hour from Sapporo, has a kappa (river imp) as its mascot.", "Sapporo's population passed 1 million in 1970.", "Sapporo's early planners brought in American advisers, which is why its layout and dairy farming have an American feel.", "The Sapporo Agricultural College campus became Hokkaido University, and its grounds are open to visitors.", "Hokkaido milk soft-serve ice cream is popular even in the middle of winter."], "tokyo": ["Tokyo was called Edo until 1868, when it was renamed Tokyo, meaning \"Eastern Capital\".", "Kyoto was the imperial capital for over 1,000 years before the emperor moved to Tokyo in 1869.", "Greater Tokyo is the most populous metropolitan area in the world, with around 37 million people.", "Shinjuku Station is the busiest railway station in the world, with over 3 million passengers a day on average.", "Shinjuku Station has more than 200 exits, so it's easy to get lost. Pick your exit before you arrive.", "The Shibuya Scramble Crossing can see up to around 3,000 people crossing at once at peak times.", "Hachiko, the dog statue at Shibuya, honours an Akita who waited at the station every day for about nine years after his owner died in 1925.", "The Hachiko statue you see today is the second one. The original was melted down for metal during World War II.", "Shibuya Sky, on top of Shibuya Scramble Square, has an open-air rooftop about 230 m above the crossing.", "Shibuya's scramble crossing appears in films like Lost in Translation and The Fast and the Furious: Tokyo Drift.", "Shibuya 109 opened in 1979 and became the centre of Japan's \"gyaru\" fashion scene.", "Miyashita Park in Shibuya is a public park built on the roof of a shopping mall.", "Senso-ji in Asakusa is Tokyo's oldest temple, traditionally founded in 628.", "Legend says two fishermen brothers pulled a small golden statue of Kannon out of the Sumida River, which led to Senso-ji's founding.", "The giant red lantern hanging in Asakusa's Kaminarimon gate weighs about 700 kg.", "Kaminarimon means \"Thunder Gate\". It is guarded by statues of Fujin, god of wind, and Raijin, god of thunder.", "Nakamise-dori, the 250 m shopping street leading to Senso-ji, is one of the oldest shopping streets in Japan.", "Senso-ji's main hall was destroyed in the 1945 air raids and rebuilt in concrete in 1958.", "Hanayashiki in Asakusa, opened in 1853, is considered Japan's oldest amusement park.", "Asakusa's Sanja Matsuri in May is one of Tokyo's wildest festivals, drawing around 2 million people.", "Tokyo Skytree is 634 m tall. 6-3-4 can be read \"mu-sa-shi\", the old name of the region.", "Tokyo Skytree is the tallest tower in the world and the second-tallest structure after the Burj Khalifa.", "Tokyo Tower (333 m) was inspired by the Eiffel Tower and is painted white and \"international orange\" to meet aviation safety rules.", "Meiji Jingu near Harajuku is dedicated to Emperor Meiji and Empress Shoken, who died in 1912 and 1914.", "Meiji Jingu's forest of about 100,000 trees was donated from all over Japan and planted by hand around a century ago.", "The forest at Meiji Jingu was designed to look after itself. Fallen leaves are swept back under the trees instead of being removed.", "Meiji Jingu's great torii gate is made of Taiwanese cypress said to be over 1,500 years old.", "Meiji Jingu usually gets more visitors than any other shrine in Japan for the New Year's first visit, often over 3 million.", "Takeshita Street in Harajuku became famous for crepes after the first crepe stands opened there in the late 1970s.", "Harajuku Station's old wooden building from 1924 was one of Tokyo's oldest wooden stations until it was replaced in 2020.", "Yoyogi Park was the site of Japan's first powered aeroplane flight in 1910.", "Yoyogi Park was the athletes' village for the 1964 Tokyo Olympics.", "The Yoyogi National Gymnasium, with its swooping roof by architect Kenzo Tange, was built for the 1964 Olympic swimming events.", "Ueno Zoo, opened in 1882, is Japan's oldest zoo.", "Ueno Park was one of Japan's first public parks, designated in 1873.", "The statue of Saigo Takamori in Ueno Park shows him in casual clothes walking his dog. His wife reportedly said it didn't look like him.", "Ameyoko market near Ueno began as a black market after World War II. The name is linked to \"ame\" (candy), and some say to \"America\".", "The Tokyo National Museum in Ueno, founded in 1872, is Japan's oldest museum.", "Yanaka, near Ueno, survived both the 1923 earthquake and the wartime bombing, so it keeps the feel of old Tokyo.", "Ginza is named after a silver coin mint set up there in 1612 (\"gin\" means silver, \"za\" means guild).", "Ginza's main street, Chuo-dori, closes to cars on weekend afternoons and becomes a \"pedestrian paradise\".", "The Wako clock tower at the Ginza 4-chome crossing is one of Tokyo's most famous landmarks. The current building dates from 1932.", "Japan's first McDonald's opened in Ginza in 1971.", "The first Starbucks outside North America opened in Ginza in 1996.", "Ginza had Japan's first gas street lamps, lit in 1874.", "Tokyo Station's red-brick Marunouchi building opened in 1914, and its domes were restored to the original design in 2012.", "More than 3,000 trains pass through Tokyo Station every day.", "The Imperial Palace stands on the site of Edo Castle, the shogun's former seat.", "In the late-1980s bubble, the Imperial Palace grounds were said to be worth more than all the real estate in California.", "Nihonbashi bridge was the starting point of Japan's five great Edo-era highways, and road distances are still measured from a marker there.", "Mitsukoshi began in 1673 as a kimono shop called Echigoya and is Japan's oldest department store chain.", "Shimokitazawa is Tokyo's vintage-clothing and indie-music neighbourhood, packed with small live houses and theatres.", "In Shimokitazawa, the Odakyu line moved underground in 2013, and the old track bed became a long strip of shops and green space.", "Akabane, where you're staying, is famous for \"senbero\" bars, places where you can get tipsy for about 1,000 yen.", "Akabane is in Kita ward, on the northern edge of Tokyo, just across the Arakawa River from Saitama.", "Kabukicho in Shinjuku is named after a kabuki theatre that was planned there after World War II but never built.", "A giant Godzilla head peers over Kabukicho from the Hotel Gracery Shinjuku, and it roars at set times.", "Omoide Yokocho (\"Memory Lane\") in Shinjuku grew out of a late-1940s black market and is lined with tiny yakitori stalls.", "Golden Gai in Shinjuku squeezes about 200 tiny bars into six narrow alleys. Some seat only five people.", "The Tokyo Metropolitan Government Building in Shinjuku has free observation decks 202 m up. On clear days you can see Mt Fuji.", "Shinjuku Gyoen was once a feudal lord's estate and mixes French, English and Japanese garden styles.", "Tokyo has more Michelin-starred restaurants than any other city in the world.", "Nigiri sushi was born in Edo in the 1820s as fast food sold from street stalls.", "Monjayaki, a runny cousin of okonomiyaki, is a Tokyo speciality, especially in Tsukishima.", "Tokyo's inner fish market moved from Tsukiji to Toyosu in 2018, but Tsukiji's outer market of food stalls is still going.", "A single bluefin tuna sold for 333.6 million yen at the 2019 New Year auction in Toyosu.", "Kappabashi is the street where restaurants buy kitchenware and the famous plastic food samples.", "The yellow ginkgo leaf is the symbol of the Tokyo Metropolitan Government.", "Late November is peak season for Tokyo's ginkgo trees, which turn bright yellow.", "The ginkgo avenue at Jingu Gaien has 146 trees, planted in 1923 and pruned into neat cone shapes.", "Tokyo Banana, a banana-cream sponge cake launched in 1991, is one of Tokyo's best-selling souvenirs.", "Tokyo's tap water is safe to drink, and the city even bottles and sells it as \"Tokyo Water\".", "Japanese train companies hand out \"delay certificates\" so passengers can prove to their boss that the train was late, sometimes for just five minutes.", "Station staff called \"oshiya\" used to be employed to push passengers into packed rush-hour trains.", "The Yamanote Line is a loop of 30 stations and takes about an hour to go all the way round.", "Many Yamanote Line stations play their own departure jingle. Takadanobaba plays the Astro Boy theme.", "Ebisu Station plays the Yebisu Beer theme tune. The district was named after the beer brewery, not the other way round.", "Japan's first railway opened in 1872 between Shimbashi in Tokyo and Yokohama.", "The Shinkansen bullet train opened in 1964, just before the Tokyo Olympics.", "Tokyo hosted the Summer Olympics in 1964 and again in 2021 (the \"2020\" Games, postponed a year).", "Tokyo was largely destroyed twice in the 20th century: by the 1923 Great Kanto Earthquake and by the 1945 air raids.", "Tokyo has 23 special wards, each run almost like its own city.", "Tokyo Metropolis also includes the Ogasawara Islands, about 1,000 km south in the Pacific.", "Odaiba's name comes from cannon batteries (\"daiba\") built in Tokyo Bay in 1853 to defend against Commodore Perry's Black Ships.", "Akihabara's electronics district grew out of a post-war black market for radio parts.", "The emoji was invented in Japan in 1999 by Shigetaka Kurita for NTT Docomo phones.", "Gotokuji temple in Setagaya claims to be the birthplace of the maneki-neko beckoning cat and is filled with thousands of them.", "Japan has around 4 million vending machines, about one for every 30 people.", "In Tokyo, people stand on the left of escalators and walk on the right. In Osaka it's the other way round.", "Most Tokyo taxis have doors that the driver opens and closes for you, so don't slam them.", "Tipping isn't expected in Tokyo and can cause confusion. Staff may chase you to return the money.", "Tokyo police receive millions of lost items each year, and billions of yen in lost cash are handed in.", "Many Tokyo sento (public bathhouses) have a giant Mt Fuji mural, a tradition that started in 1912.", "The official cherry tree that signals the start of Tokyo's blossom season is at Yasukuni Shrine.", "Tokyo Dome, home of the Yomiuri Giants, is nicknamed \"the Big Egg\".", "Edo was once one of the largest cities in the world, with around a million people in the 1700s.", "The first Japanese convenience store chains started in the 1970s. Tokyo now has thousands of konbini, many open 24 hours.", "Tokyo's address system numbers city blocks rather than streets, and most streets have no names.", "Tokyo's Kabuki-za theatre in Ginza first opened in 1889. The current building, from 2013, has a skyscraper rising behind it.", "Haneda Airport was Tokyo's main international airport until Narita opened in 1978, and it took back many international flights from 2010."], "uji": ["Byodo-in's Phoenix Hall is printed on the Japanese 10-yen coin, a design in use since 1951.", "The phoenix on the roof of Byodo-in appeared on the back of the old 10,000-yen note.", "Byodo-in was a villa of the powerful statesman Fujiwara no Michinaga. His son turned it into a temple in 1052.", "The Phoenix Hall was built in 1053 and has survived for nearly 1,000 years.", "Byodo-in means \"Temple of Equality\".", "The Phoenix Hall gets its name from its shape, like a phoenix spreading its wings, and from the two bronze phoenixes on its roof.", "The Phoenix Hall was designed to recreate Amida Buddha's Pure Land paradise on earth, reflected in the pond in front.", "Inside the Phoenix Hall is a gilded Amida Buddha by the master sculptor Jocho.", "The walls of the Phoenix Hall hold 52 small wooden Bodhisattvas riding on clouds, many playing musical instruments.", "The original bronze phoenixes and the temple bell are kept in Byodo-in's Hoshokan museum.", "Byodo-in's bell is one of the three most famous temple bells in Japan, known for its beauty.", "The Phoenix Hall was restored in 2012–2014 to its original red colour.", "Ujigami Shrine's main hall, from around 1060, is thought to be the oldest surviving Shinto shrine building in Japan.", "Both Byodo-in and Ujigami Shrine are UNESCO World Heritage Sites.", "The last ten chapters of The Tale of Genji, the \"Uji chapters\", are set in Uji.", "The Tale of Genji, written around 1008 by Murasaki Shikibu, is often called the world's first novel.", "Uji has a Tale of Genji Museum.", "A statue of Murasaki Shikibu sits near Uji Bridge.", "Uji Bridge is one of Japan's oldest bridges, first built in 646 according to tradition.", "Uji Bridge has a small balcony on its upstream side. Toyotomi Hideyoshi is said to have drawn water there for his tea ceremonies.", "Tsuen, the tea shop at the east end of Uji Bridge, has been run by the same family since 1160.", "The Uji River flows out of Lake Biwa, Japan's largest lake.", "Battles of the Genpei War were fought at Uji Bridge in 1180 and 1184.", "Uji was a favourite /* ---------- categories ---------- */
const DEFAULT_CATS = [
  {id:'transport', name:'Transport'}, {id:'food', name:'Food & drink'}, {id:'attractions', name:'Attractions & tickets'},
  {id:'shopping', name:'Shopping'}, {id:'accommodation', name:'Accommodation'}, {id:'flights', name:'Flights'},
  {id:'luggage', name:'Luggage & lockers'}, {id:'other', name:'Other'}
];
function guessCat(it){
  const a = (it.act+' '+it.mode).toLowerCase();
  if (/flight|vj8|pr4|pr5|mm115/.test(a)) return 'flights';
  if (/locker/.test(a)) return 'luggage';
  if (/breakfast|lunch|dinner|snack|café|cafe|coffee|dessert|seafood|matcha|food|market breakfast/.test(a) && !/→/.test(it.area)) return 'food';
  if (/shopping|thrift|don quijote|shop/.test(a) && !/→/.test(it.area)) return 'shopping';
  if (/→/.test(it.area) || /train|bus|subway|jr |shinkansen/.test(a)) return 'transport';
  if (/ticket|sky|ropeway|byodoin|todai|tenryu|garden|gyoen|kiyomizu|okochi|admission|museum|cruise|park/.test(a)) return 'attractions';
  return 'other';
}

function rates(){ const r = ST().rates || {}; return {IDR:1, JPY:+r.JPY || +ST().fx || 110, MYR:+r.MYR || 3850, SGD:+r.SGD || 13900}; }

function fmtCur(a, cur){
  if (cur==='IDR') return 'Rp' + Math.round(a).toLocaleString('id-ID');
  if (cur==='JPY') return '¥' + Math.round(a).toLocaleString('en-US');
  const s = a.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (cur==='MYR' ? 'RM' : 'S$') + s;
}
const fmtR = idr => fmtCur(idr / rates()[DISP], DISP);      // any IDR amount -> display currency
const fmtJ = n => '¥' + Math.round(n).toLocaleString('en-US');
const toIdr = m => !m || !m.amt ? 0 : m.amt * (rates()[m.cur] || 1);   // one unit as entered
const mTotal = m => toIdr(m) * (m && m.basis==='pp' ? ST().people : 1); // whole group
function showMoney(m, label, cls=''){
  if (!m || !m.amt) return '';
  const b = m.basis==='pp' ? ' pp' : ' total';
  const orig = m.cur!==DISP ? ` <span class="orig">(${fmtCur(m.amt, m.cur)})</span>` : '';
  return `<span class="${cls}">${label} ${fmtR(toIdr(m))}${b}</span>${orig}`;
}
const short = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const wk = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||''); return m ? +m[1]*60 + +m[2] : null; };
const fromMin = m => { m = Math.max(0, Math.min(23*60+59, Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };

/* ---------- effective items ---------- */
function dayDoc(date){ return S.days[date] || {ov:{}, custom:{}}; }
function items(i, {withShift=true, includeRemoved=false}={}){
  const d = DATA.days[i], doc = dayDoc(d.date);
  let list = d.items.map((b,k)=>{
    const base = { id:'b'+k, k, base:true, time:b.time, origTime:b.time, area:b.area, act:b.act, mode:b.mode, dur:b.dur, ticket:b.ticket, status:b.status, note:b.note, src:b.src,
      est: b.jpy ? {amt:b.jpy, cur:'JPY'} : (b.idr ? {amt:b.idr, cur:'IDR'} : {amt:0, cur:'JPY'}),
      paid:{amt:0, cur:'JPY'}, cat: guessCat(b), media:[], noteMedia:[], done:false, removed:false, snowOpt: /^OPTION [ABC]/.test(b.act) ? b.act[7] : null };
    return normMoney(Object.assign(base, doc.ov?.['b'+k] || {}));
  });
  Object.entries(doc.custom || {}).forEach(([id,c])=> list.push(normMoney(Object.assign({id, k:999, base:false, status:'Custom', est:{amt:0,cur:'JPY'}, paid:{amt:0,cur:'JPY'}, cat:'other', media:[], noteMedia:[]}, c))));
  if (!includeRemoved) list = list.filter(x=>!x.removed);
  list.sort((a,b)=> (toMin(a.time)??9999)-(toMin(b.time)??9999) || a.k-b.k);
  const sh = S.ui.shift;
  if (withShift && sh && sh.day===i && sh.mins){
    const from = list.findIndex(x=>x.id===sh.from);
    if (from>=0) list.forEach((x,n)=>{ if(n>=from && toMin(x.time)!==null){ x.preview = fromMin(toMin(x.time)+sh.mins); x.shifting = true; } });
  }
  return list;
}
const countsEst = it => !it.snowOpt || it.snowOpt===ST().snow;
function normMoney(it){
  it.est = Object.assign({amt:0, cur:'JPY'}, it.est); it.est.basis = it.est.basis || 'pp';
  it.paid = Object.assign({amt:0, cur:'JPY'}, it.paid); it.paid.basis = it.paid.basis || 'total';
  it.media = it.media || []; it.noteMedia = it.noteMedia || [];
  it.extra = (it.extra || []).map(x=>({id:x.id||'x'+Math.random().toString(36).slice(2,7), name:x.name||'', cat:x.cat||'other',
    est:Object.assign({amt:0,cur:'JPY',basis:'pp'}, x.est), paid:Object.assign({amt:0,cur:'JPY',basis:'total'}, x.paid)}));
  return it;
}
// every expense on an item: the main one plus any extras
const exps = it => [{name:'', cat:it.cat, est:it.est, paid:it.paid}, ...(it.extra||[])];
const sumEst = (it)=> exps(it).reduce((a,x)=>a+mTotal(x.est),0);
const sumPaid = (it)=> exps(it).reduce((a,x)=>a+mTotal(x.paid),0);
const sumEstPaid = (it)=> exps(it).filter(x=>x.paid.amt).reduce((a,x)=>a+mTotal(x.est),0);
const hasCost = it => exps(it).some(x=>x.est.amt||x.paid.amt);
function costBlock(it, notChosen=false){
  const nc = notChosen ? ' <span class="muted">(not chosen)</span>' : '';
  if (!(it.extra||[]).length) return `<span class="cost">${showMoney(it.est,'Est')}${nc}${it.paid.amt?'<br>'+showMoney(it.paid,'Paid','paid'):''}</span>`;
  const one = (x,main) => (x.est.amt||x.paid.amt) ? `<div class="row sp small" style="gap:10px;flex-wrap:nowrap"><span>${esc(x.name || (main?'Main':'Expense'))} <span class="catpill">${esc(catName(x.cat))}</span></span><span class="cost">${showMoney(x.est,'Est')}${x.paid.amt?'<br>'+showMoney(x.paid,'Paid','paid'):''}</span></div>` : '';
  return `<div style="width:100%;margin-top:4px">${exps(it).map((x,n)=>one(x,n===0)).join('')}<div class="row sp small" style="border-top:1px solid var(--line2);padding-top:4px;margin-top:4px"><b>Total${nc}</b><span class="cost">est ${fmtR(sumEst(it))}${sumPaid(it)?`<br><span class="paid">paid ${fmtR(sumPaid(it))}</span>`:''}</span></div></div>`;
}
function preItems(){ return Object.entries(S.pre.items || {}).map(([id,x])=>normMoney(Object.assign({id, kind:'pre', name:'', cat:'other', note:''}, clone(x)))).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name)); }
function preTotals(){ const l = preItems(); return { est: l.reduce((a,x)=>a+sumEst(x),0), paid: l.reduce((a,x)=>a+sumPaid(x),0), estPaid: l.reduce((a,x)=>a+sumEstPaid(x),0) }; }

/* ---------- persistence ---------- */
const queues = {};
function setSync(t){ $('#sync').textContent = t; }
const dirty = ls.get('dirty', {});   // edits made offline, waiting to be sent
function markDirty(path, on=true){ if (on) dirty[path] = 1; else delete dirty[path]; ls.set('dirty', dirty); }
const bodyOf = path => path.startsWith('days/') ? (S.days[path.slice(5)] || {ov:{}, custom:{}}) : path==='pretrip/main' ? S.pre : S.settings;
async function flushDirty(db){
  for (const p of Object.keys(dirty)){ try { await db.doc(p).set(bodyOf(p)); markDirty(p, false); } catch(e){ return false; } }
  return true;
}
function writeDoc(path, body){
  if (!S.db){ if (SB_CONF && SB_CONF.url){ markDirty(path); setSync('Saved on this device'); } return Promise.resolve(); }
  queues[path] = (queues[path] || Promise.resolve()).then(async ()=>{
    setSync('Saving…');
    try { await S.db.doc(path).set(body); }
    catch(e){
      if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); await S.db.doc(path).set(body); }
      else { throw e; }
    }
    markDirty(path, false); setSync('Saved');
  }).catch(e=>{
    if (e && e.code==='invalid_argument'){ S.canWrite=false; setSync('View only'); route(); }
    else if (e && e.code==='quota_exceeded'){ setSync('Storage full'); }
    else { if (SB_CONF && SB_CONF.url){ markDirty(path); setSync('Saved on this device'); } else setSync('Save failed — retry'); }
  });
  return queues[path];
}
function saveDay(date){
  const doc = S.days[date] || {ov:{}, custom:{}};
  ls.set('days', S.days);
  return writeDoc('days/'+date, doc);
}
function savePre(){ ls.set('pre', S.pre); return writeDoc('pretrip/main', S.pre); }
function saveSettings(){ ls.set('settings', S.settings); return writeDoc('settings/main', S.settings); }
function patchItem(i, it, patch){
  const date = DATA.days[i].date;
  const doc = S.days[date] = clone(dayDoc(date));
  doc.ov = doc.ov || {}; doc.custom = doc.custom || {};
  if (it.base) doc.ov[it.id] = Object.assign(doc.ov[it.id] || {}, patch);
  else doc.custom[it.id] = Object.assign(doc.custom[it.id] || {}, patch);
  route(); return saveDay(date);
}

const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
let signQ = new Set(), signT = null;
function queueSign(id){
  if (SIGNED[id] === undefined){ SIGNED[id] = null; signQ.add(id); }
  clearTimeout(signT);
  signT = setTimeout(async ()=>{
    const ids = [...signQ]; signQ = new Set(); if (!ids.length || !SB) return;
    const { data } = await SB.storage.from('trip-media').createSignedUrls(ids.map(x=>x.slice(3)), 60*60*24);
    (data||[]).forEach((r,n)=>{ if (r && r.signedUrl) SIGNED[ids[n]] = r.signedUrl; });
    if (E) renderModal(); else route();
  }, 30);

function connect(){
  if (window.claude && claude.use) return connectClaude();
  if (SB_CONF && SB_CONF.url) return connectSupabase();

}
async function connectClaude(){
  const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]);
  S.assets = assets;
  if (!db){ setSync('This device only'); route(); return; }
  S.db = db; S.mode = 'db';
  try { if (user){ const w = await user.can('data.write'); if (w === false) S.canWrite = false; } } catch(e){}
  subscribeAll(db);
}
function subscribeAll(db){
  let gotDays=false, gotSet=false;
  const timer = setTimeout(()=>{ if(!gotDays||!gotSet) setSync('Offline — may be out of date'); }, 10000);
  const done = ()=>{ if(gotDays&&gotSet){ clearTimeout(timer); setSync(S.canWrite ? 'Synced' : 'View only'); } };
  const redraw = ()=>{ if (!$('#modal').innerHTML) route(); };
  db.doc('pretrip/main').onSnapshot(snap=>{
    S.pre = snap.exists ? clone(snap.data()) : {items:{}}; S.pre.items = S.pre.items || {}; ls.set('pre', S.pre); redraw();
  }, e=>{});
  db.collection('days').onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(d=>{ if (d.exists) next[d.id] = clone(d.data()); });
    S.days = next; ls.set('days', next);
    if (!snap.metadata.fromCache){ gotDays = true; done(); } redraw();
  }, e=>{ clearTimeout(timer); setSync('Sync stopped'); });
  db.doc('settings/main').onSnapshot(snap=>{
    if (snap.exists){ const v = clone(snap.data()); if (!v.cats || !v.cats.length) v.cats = DEFAULT_CATS; v.bdone = v.bdone || {}; S.settings = v; ls.set('settings', v); }
    if (!snap.metadata.fromCache){ gotSet = true; done(); } redraw();
  }, e=>{ clearTimeout(timer); setSync('Sync stopped'); });
  route();
}

/* Supabase: a small adapter with the same shape the app already uses */
function sbAdapter(sb){
  const cache = new Map(), docL = new Map(), colL = [];
  const snapOf = p => { const has = cache.has(p); return { id: p.split('/').slice(1).join('/'), exists: has, data: () => has ? cache.get(p) : undefined, metadata:{fromCache:false, hasPendingWrites:false} }; };
  const emitDoc = p => (docL.get(p)||[]).forEach(f=>f(snapOf(p)));
  const emitCol = c => colL.filter(l=>l.c===c).forEach(l=>{ const docs = [...cache.keys()].filter(k=>k.startsWith(c+'/')).map(snapOf); l.f({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false}}); });
  const emitAll = () => { [...docL.keys()].forEach(emitDoc); [...new Set(colL.map(l=>l.c))].forEach(emitCol); };
  const toErr = e => ({ code: (e && (e.code==='42501' || /row-level security/i.test(e.message||''))) ? 'invalid_argument' : 'unavailable', message: e && e.message });
  async function load(){
    const { data, error } = await sb.from('trip_docs').select('path,data');
    if (error) throw toErr(error);
    cache.clear(); data.forEach(r=>cache.set(r.path, r.data)); emitAll();
  }
  sb.channel('trip_docs').on('postgres_changes', {event:'*', schema:'public', table:'trip_docs'}, ev=>{
    const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); if (!p) return;
    if (ev.eventType === 'DELETE') cache.delete(p); else cache.set(p, ev.new.data);
    emitDoc(p); emitCol(p.split('/')[0]);
  }).subscribe(st=>{ if (st==='SUBSCRIBED') load().catch(()=>{}); });
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') load().catch(()=>{}); });
  const db = {
    doc: path => ({
      async set(body){ cache.set(path, body); const { error } = await sb.from('trip_docs').upsert({path, data:body}); if (error) throw toErr(error); },
      async delete(){ cache.delete(path); const { error } = await sb.from('trip_docs').delete().eq('path', path); if (error) throw toErr(error); },
      onSnapshot(f){ docL.set(path, [...(docL.get(path)||[]), f]); if (cache.size) f(snapOf(path)); return ()=>{}; }
    }),
    collection: c => ({ onSnapshot(f){ colL.push({c, f}); if (cache.size) emitCol(c); return ()=>{}; } })
  };
  const assets = {
    async upload(blob){
      const ext = ((blob.type||'').split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5) || 'bin';
      const key = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from('trip-media').upload(key, blob, {contentType: blob.type || undefined, upsert:false});
      if (error) throw error;
      const id = 'sb:'+key;
      const s = await sb.storage.from('trip-media').createSignedUrl(key, 60*60*24);
      if (s.data) SIGNED[id] = s.data.signedUrl;
      return { id, url: undefined, sizeBytes: blob.size, contentType: blob.type };
    },
    async delete(id){ if (id && id.startsWith('sb:')) await sb.storage.from('trip-media').remove([id.slice(3)]); }
  };
  return { db, assets, load, cache };
}

function loadScript(src){ return new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function connectSupabase(){
  setSync('Connecting…');
  try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'); }
  catch(e){ setSync(DATA ? 'Offline — this device only' : 'Offline'); route(); return; }
  SB = supabase.createClient(SB_CONF.url, SB_CONF.key, { auth: { persistSession:true, storageKey:'jp26-auth', detectSessionInUrl:true } });
  SB.auth.onAuthStateChange((ev, session)=>{
    if (ev === 'PASSWORD_RECOVERY'){ openLogin('reset'); return; }
    if (ev === 'SIGNED_OUT'){ S.user = null; S.db = null; S.assets = null; S.mode = 'local'; setSync('Sign in to sync'); route(); }
  });
  const { data:{ session } } = await SB.auth.getSession();
  if (session) await startSupabase(session); else { setSync('Sign in to sync'); route(); }
}
async function startSupabase(session){
  S.user = session.user.email;
  const { data, error } = await SB.from('trip_members').select('email').limit(1);
  if (error){ setSync('Offline — this device only'); route(); return; }
  if (!data.length){ S.notMember = true; setSync('Not on the trip list'); route(); return; }
  S.notMember = false;
  const a = sbAdapter(SB);
  if (Object.keys(dirty).length){ setSync('Sending offline edits…'); await flushDirty(a.db); }
  try { await a.load(); } catch(e){ setSync('Offline — this device only'); route(); return; }
  const base = a.cache.get('base/itinerary');
  if (base){ DATA = base; ls.set('base', base); }
  S.db = a.db; S.assets = a.assets; S.mode = 'db'; S.canWrite = true;
  subscribeAll(a.db);
}

/* ---------- small renderers ---------- */
function statusClass(s){
  s = (s||'').toLowerCase();
  if (s==='custom') return 'custom';
  if (s.startsWith('book') || s.includes('pending')) return 'book';
  if (s.startsWith('fixed')) return 'fixed';
  if (s.startsWith('optional')) return 'opt';
  return s ? 'flex' : '';
}
function badge(s){ return s ? `<span class="badge b-${statusClass(s)}">${esc(s)}</span>` : ''; }
const mapQ = q => encodeURIComponent(q.replace(/\s*\/\s*/g,' ').trim());
function mapLink(it, i){
  const city = region(DATA.days[i].date)[1] || 'Japan', a = (it.area||'').trim();
  if (!a || /flex day|^(KUL|SGN|MNL|SIN)\b/i.test(a)) return '';
  const parts = a.split('→').map(x=>x.trim()).filter(Boolean);
  const tag = x => /\b(HND|KIX|CTS)\b/.test(x) ? x.replace('HND','Haneda Airport').replace('KIX','Kansai Airport').replace('CTS','New Chitose Airport') : x+', '+city+', Japan';
  const url = parts.length > 1
    ? `https://www.google.com/maps/dir/?api=1&origin=${mapQ(tag(parts[0]))}&destination=${mapQ(tag(parts[parts.length-1]))}&travelmode=transit`
    : `https://www.google.com/maps/search/?api=1&query=${mapQ(tag(a))}`;
  return `<a class="lnk" href="${url}" target="_blank" rel="noopener">${parts.length>1?'Route':'Map'} ↗</a>`;
}
function link(src){ return /^https?:/.test(src) ? `<a href="${esc(src)}" target="_blank" rel="noopener">Source ↗</a>` : (src ? `<span class="muted">${esc(src)}</span>` : ''); }
function mediaUrl(m){ if (m.id && m.id.startsWith('sb:')){ if (SIGNED[m.id]) return SIGNED[m.id]; queueSign(m.id); return BLANK; } return m.url || ('/_blob/'+m.id); }
function thumbs(list, removable, field='media'){
  if (!list || !list.length) return '';
  return `<div class="media">${list.map((m,n)=>`<button class="thumb" data-view="${n}" data-src="${esc(mediaUrl(m))}" data-type="${esc(m.type)}">

/* ---------- Japan clock ---------- */
function jpNow(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date:`${g('year')}-${g('month')}-${g('day')}`, mins:(+g('hour')%24)*60 + +g('minute'), hm:`${String(+g('hour')%24).padStart(2,'0')}:${g('minute')}` };
}
const dayIndexForDate = d => DATA.days.findIndex(x=>x.date===d);
const WK_JA = ['日','月','火','水','木','金','土'];
const wkJa = d => WK_JA[new Date(d+'T00:00:00').getDay()];
function region(d){
  const n = DATA.days.findIndex(x=>x.date===d);
  if (n<=0) return ['移動','Travel'];
  if (n===DATA.days.length-1) return ['帰路','Homeward'];
  const s = (DATA.days[n].stay||'').toLowerCase();
  if (s.includes('akabane')) return ['東京','Tokyo'];
  if (s.includes('eirin')) return ['河口湖','Kawaguchiko'];
  if (s.includes('webase')) return ['京都','Kyoto'];
  if (s.includes('quintessa')) return ['札幌','Sapporo'];
  return ['旅','Japan'];
}


/* ---------- pace countdown ---------- */
function jpSecs(){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => +p.find(x=>x.type===t).value;
  return (g('hour')%24)*3600 + g('minute')*60 + g('second');
}
const fmtCD = s => { const a=Math.abs(s), h=Math.floor(a/3600), m=Math.floor(a%3600/60), x=a%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
function paceHTML(idx){
  const list = items(idx).filter(it => toMin(it.time) !== null);
  if (!list.length) return '';
  const now = jpSecs(), hms = `${String(Math.floor(now/3600)).padStart(2,'0')}:${String(Math.floor(now%3600/60)).padStart(2,'0')}:${String(now%60).padStart(2,'0')}`;
  // the stop you are on = last stop whose start has passed; the next = the one after
  let ci = -1; list.forEach((it,n)=>{ if (toMin(it.time)*60 <= now) ci = n; });
  const cur = ci>=0 ? list[ci] : null, nxt = list[ci+1] || null;
  const hard = list.slice(ci+1).find(it => /BOOKED|PAID/i.test(it.status||''));
  let state='relax', label='Relax', big='', sub='';
  if (!nxt){ state='relax'; label='Last stop'; big='—'; sub='Nothing else after this today.'; }
  else {
    const left = toMin(nxt.time)*60 - now;
    big = fmtCD(left);
    if (left > 15*60){ state='relax'; label='Plenty of time'; }
    else if (left > 5*60){ state='wrap'; label='Start wrapping up'; }
    else { state='go'; label='Leave now'; }
    sub = `until <b>${esc(nxt.time)}</b> · ${esc(nxt.act)}`;
  }
  const hardTxt = hard ? (()=>{ const l = toMin(hard.time)*60 - now; return `<div class="pc-hard"><span class="lbl">Can't miss</span> ${esc(hard.time)} · ${esc(hard.act.slice(0,46))} <b>${l>0?'in '+fmtCD(l):'now'}</b></div>`; })() : '';
  const span = cur && nxt ? (toMin(nxt.time)-toMin(cur.time))*60 : 0;
  const pct = span>0 ? Math.min(100, Math.max(0, 100*(now - toMin(cur.time)*60)/span)) : 0;
  return `<div class="card pace pc-${state}">
    <div class="row sp" style="align-items:baseline"><span class="lbl">Japan time</span><span class="pc-clock">${hms}</span></div>
    ${cur?`<div class="small" style="margin-top:6px"><span class="lbl">Now</span>${esc(cur.time)} · ${esc(cur.act)}</div>`:''}
    <div class="pc-state">${label}</div>
    <div class="pc-big">${big}</div>
    <div class="small">${sub}</div>
    ${span?`<div class="pc-bar"><i style="width:${pct}%"></i></div>`:''}
    ${hardTxt}
  </div>`;
}

function vBudget(){
  const st = ST(), pre = preItems(), pt = preTotals();
  const rows = DATA.days.map((d,i)=>({d,i,...dayTotals(i)}));
  const est = pt.est + rows.reduce((a,r)=>a+r.est,0), paid = pt.paid + rows.reduce((a,r)=>a+r.paid,0), estPaid = pt.estPaid + rows.reduce((a,r)=>a+r.estPaid,0);
  const byCat = {};
  const addCat = (it, inc) => exps(it).forEach(x=>{ const c = catExists(x.cat) ? x.cat : 'other'; byCat[c] = byCat[c] || {est:0, paid:0}; if (inc) byCat[c].est += mTotal(x.est); byCat[c].paid += mTotal(x.paid); });
  pre.forEach(it=>addCat(it, true));
  DATA.days.forEach((d,i)=> items(i,{withShift:false}).forEach(it=>addCat(it, countsEst(it))));
  const cats = st.cats.filter(c=>byCat[c.id] && (byCat[c.id].est || byCat[c.id].paid));
  const maxC = Math.max(1, ...cats.map(c=>Math.max(byCat[c.id].est, byCat[c.id].paid)));
  const diff = (e,p) => !p ? '<span class="muted">—</span>' : `<span class="${p>e?'over':'under'}">${p>e?'+':'−'}${fmtR(Math.abs(p-e))}</span>`;
  const ro = !S.canWrite;
  return `<h2>Budget</h2>
  <p class="small muted" style="margin-top:-6px">Amounts shown in ${DISP} · ${st.people} people · change rates in <a href="#settings">Settings</a></p>
  <div class="grid2">
    <div class="card"><div class="muted small">Estimated · whole trip</div><div class="tot">${fmtR(est)}</div><div class="small muted">${fmtR(est/st.people)} per person</div></div>
    <div class="card"><div class="muted small">Actually paid so far</div><div class="tot" style="color:var(--green)">${fmtR(paid)}</div><div class="small muted">${paid ? Math.round(paid/est*100)+'% of the estimate · '+fmtR(paid/st.people)+' pp' : 'Add costs with Edit on any stop'}</div></div>
  </div>
  <h2>Before the trip</h2>
  <p class="small muted" style="margin-top:-6px">Hotels, flights, insurance, visa, SIM, rail passes — anything paid or planned before you leave.</p>
  ${pre.map(x=>`<div class="card"><div class="row sp" style="align-items:flex-start;flex-wrap:nowrap">
      <div style="min-width:0"><h3 style="margin:0">${esc(x.name)}</h3><div class="meta">${esc(catName(x.cat))}${x.date?' · '+esc(x.date):''}${x.note?' · '+esc(x.note.slice(0,60)):''}</div></div>
      ${(x.extra||[]).length ? '' : `<span class="cost">${x.est.amt?showMoney(x.est,'Est'):'<span class="muted">No estimate</span>'}${x.paid.amt?'<br>'+showMoney(x.paid,'Paid','paid'):''}</span>`}</div>${(x.extra||[]).length ? costBlock(x) : ''}
      ${thumbs(x.noteMedia,false)}
      ${ro?'':`<div class="acts"><button class="lnk" data-preedit="${esc(x.id)}">Edit</button></div>`}</div>`).join('') || '<div class="card small muted">Nothing yet.</div>'}
  ${ro?'':`<div style="margin-top:14px"><button class="btn" data-preadd>Add pre-trip cost</button></div>`}
  <h2>By day</h2>
  <div class="card" style="overflow-x:auto"><table>
    <thead><tr><th>Day</th><th>Estimated</th><th>Paid</th><th>Over / under*</th></tr></thead>
    <tbody><tr><td><b>Before trip</b></td><td>${fmtR(pt.est)}</td><td>${pt.paid?fmtR(pt.paid):'<span class="muted">—</span>'}</td><td>${diff(pt.estPaid,pt.paid)}</td></tr>
    ${rows.map(r=>`<tr><td><a href="#itinerary" data-goto="${r.i}">${short(r.d.date)}</a></td><td>${fmtR(r.est)}</td><td>${r.paid?fmtR(r.paid):'<span class="muted">—</span>'}</td><td>${diff(r.estPaid,r.paid)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${fmtR(est)}</td><td>${fmtR(paid)}</td><td>${diff(estPaid,paid)}</td></tr></tfoot>
  </table><p class="small muted" style="margin:8px 0 0">* Compares what you paid against the estimate for the same items only, so unpaid items don't count as savings.</p></div>
  <h2>By category</h2>
  <div class="card">
    <div class="legend" style="margin-bottom:10px"><span><i style="background:#c9bfae"></i>Estimated</span><span><i style="background:var(--red)"></i>Paid</span></div>
    ${cats.map(c=>{ const v = byCat[c.id]; return `<div class="row sp small"><b>${esc(c.name)}</b><span class="cost">${fmtR(v.est)} est · <span class="paid">${fmtR(v.paid)}</span></span></div>
      <div class="cbar"><div class="tr"><div class="e" style="width:${(v.est/maxC*100).toFixed(1)}%"></div></div><div class="tr"><div class="p" style="width:${(v.paid/maxC*100).toFixed(1)}%"></div></div></div>`; }).join('') || '<div class="muted small">No costs yet.</div>'}
  </div>
  <p class="small muted">Per-person amounts are multiplied by the number of people; “total” amounts are counted once. Every currency is converted with the rates in Settings.</p>`;
}

async function compress(file){
  if (!file.type.startsWith('image/') || file.size < 1.5e6 || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch(e){ return file; }
}
async function upload(files, field){
  readForm(); E.err = '';
  const allowVideo = field==='media';
  for (const f of files){
    if (!(f.type.startsWith('image/') || (allowVideo && f.type.startsWith('video/')))){ E.err = `${f.name}: ${allowVideo?'only photos and videos':'only pictures'} here.`; renderModal(); continue; }
    E.busy++; renderModal();
    const mine = E;
    try {
      const blob = await compress(f);
      if (blob.size > 20*1024*1024){ mine.err = `${f.name} is ${(blob.size/1048576).toFixed(0)} MB — over the 20 MB limit. Trim or compress it first.`; }
      else {
        const r = await S.assets.upload(blob);
        mine.draft[field].push({id:r.id, url:r.url, type: f.type.startsWith('video') ? 'video':'image', name:f.name});
        mine.uploaded.push(r.id);
        if (E !== mine) { try{ S.assets.delete(r.id); }catch(_){} }
      }
    } catch(e){ mine.err = `Couldn't upload ${f.name}${e && e.message ? ': '+e.message : ''}.`; }
    mine.busy--; if (E === mine) renderModal();
  }
}

const WXP = {tokyo:[35.68,139.69,'Tokyo',9,17], fuji:[35.50,138.76,'Kawaguchiko',1,12], kyoto:[35.01,135.77,'Kyoto',6,15], sapporo:[43.06,141.35,'Sapporo',-3,3], otaru:[43.19,141.00,'Otaru',-3,3]};
const WXDAY = ['tokyo','tokyo','tokyo','tokyo','fuji','kyoto','kyoto','kyoto','kyoto','sapporo','sapporo','otaru','sapporo','sapporo'];
let WX = ls.get('wx', null), _wxBusy = false;
const wxWord = c => c===0?'Clear':c<=2?'Partly cloudy':c===3?'Cloudy':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':c<=86?'Snow showers':'Thunderstorm';
function wxLine(i){
  const k = WXDAY[i], p = WXP[k]; if (!p) return '';
  const f = WX && WX.d && WX.d[k] && WX.d[k][DATA.days[i].date];
  if (f) return `<div class="wx"><b>${esc(wxWord(f[0]))}</b> · ${Math.round(f[2])}° to ${Math.round(f[1])}°C${f[3]!=null?` · ${f[3]}% chance of rain or snow`:''} <span class="muted">· ${p[2]} forecast</span></div>`;
  return `<div class="wx"><span class="muted">Usually about ${p[3]}° to ${p[4]}°C in ${p[2]} this time of year · forecast appears closer to the day</span></div>`;
}
async function fetchWx(){
  if (!DATA || _wxBusy || (WX && Date.now()-WX.t < 3*3600e3)) return;
  const iso = d => d.toISOString().slice(0,10), today = jpNow().date;
  const start = today > DATA.days[0].date ? today : DATA.days[0].date;
  const lim = iso(new Date(Date.parse(today+'T00:00:00Z') + 15*86400e3)), last = DATA.days[DATA.days.length-1].date;
  const end = lim < last ? lim : last;
  if (start > end) return;
  _wxBusy = true;
  try {
    const ks = Object.keys(WXP);
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ks.map(k=>WXP[k][0]).join(',')}&longitude=${ks.map(k=>WXP[k][1]).join(',')}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=${start}&end_date=${end}`);
    if (!r.ok) throw 0;
    let j = await r.json(); if (!Array.isArray(j)) j = [j];
    const d = {};
    j.forEach((loc,n)=>{ const k = ks[n], x = loc.daily; if (!k || !x) return; d[k] = {};
      x.time.forEach((dt,m)=>{ if (x.temperature_2m_max[m]!=null) d[k][dt] = [x.weather_code[m], x.temperature_2m_max[m], x.temperature_2m_min[m], x.precipitation_probability_max ? x.precipitation_probability_max[m] : null]; }); });
    WX = {t:Date.now(), d}; ls.set('wx', WX);
    if (!$('#modal').innerHTML && /^#?(today|itinerary)?$/.test(location.hash.replace('#',''))) route();
  } catch(e){}
  _wxBusy = false;
}

/* ---------- day moods ---------- */
